<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Album — Guest Access</title>
<style>
:root{color-scheme:dark;--lime:#efff17;--green:#42ff81;--muted:#a7c2ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 100% 0,#15391d,#030b06 65%);color:#f4fff6;font:16px system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:1080px;padding:26px 18px 80px;margin:auto}header{text-align:center;margin-bottom:32px}h1{font-size:clamp(60px,12vw,110px);font-weight:1000;letter-spacing:-.07em;line-height:.85;color:var(--lime);margin:22px 0;text-shadow:0 0 26px #b3ff0040}h2{font-size:25px}p{color:var(--muted)}.gate{max-width:440px;margin:35px auto;background:#0d2415;border:1px solid #416945;padding:30px 24px;box-shadow:0 14px 50px #0008;border-radius:22px;text-align:center}.gate p{line-height:1.6}input{width:100%;padding:18px;background:#010c04;border:2px solid #456f49;color:white;text-align:center;border-radius:12px;font-size:30px;letter-spacing:.22em;font-weight:800}button{border:0;cursor:pointer;background:var(--lime);color:#091309;padding:17px 22px;border-radius:12px;font-size:17px;font-weight:900;width:100%;margin-top:14px}button:disabled{opacity:.6;cursor:wait}#status{min-height:22px;color:#ff9ca8}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:#0b1a10;border:1px solid #315639;border-radius:15px;overflow:hidden}.card img,.card video{display:block;width:100%;height:280px;object-fit:contain;background:black}.info{padding:15px}.who{font-weight:800;color:var(--lime);overflow-wrap:anywhere}.info a{color:var(--green);display:inline-block;margin-top:9px}.like{width:auto;padding:9px 16px;font-size:14px;background:#213724;color:var(--lime)}#toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:25px 0}#toolbar button{width:auto;margin:0;padding:10px 14px;background:#233d28;color:white}#galleryStatus{text-align:center;margin:40px} [hidden]{display:none!important}
</style></head><body><main>
<header><h1>PARTY ALBUM</h1><p>Only tonight's guests get the memories.</p></header>
<section id="gate" class="gate"><h2>YOUR INVITE CODE</h2><p>Ask the DJ for a fresh one-time code. Each code admits one guest and expires after five minutes if unused.</p><form id="codeForm"><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" placeholder="00000000" aria-label="Eight digit access code" required><button id="unlock" type="submit">UNLOCK THE ALBUM</button></form><p id="status" role="status"></p></section>
<section id="private" hidden><div id="toolbar"><span id="timeLeft"></span><button id="leave">Leave gallery</button></div><div id="galleryStatus">Loading tonight's memories…</div><div id="gallery"></div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,getDocFromServer,getDocsFromServer,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";
import { previewWhenVisible, privateMediaUrl, releaseMedia } from "./gallery-media.js";
const app=initializeApp({apiKey:"AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",authDomain:"dj-photo-wall.firebaseapp.com",projectId:"dj-photo-wall",storageBucket:"dj-photo-wall.firebasestorage.app",messagingSenderId:"187308843014",appId:"1:187308843014:web:a4dbf9c17011767890a387"},"gallery-guest"),db=getFirestore(app),auth=getAuth(app),fn=getFunctions(app,"us-central1");
const $=s=>document.querySelector(s);
let generation = 0, redeeming = false, loading = false;
let stopState, expiryTimer, previews;
const grid = $("#gallery");
const stateRef = doc(db, "gallery_state", "current");
const message = text => { $("#status").textContent = text; };

function hideGallery(reason) {
  generation++;
  stopState?.();
  clearTimeout(expiryTimer);
  previews?.disconnect();
  releaseMedia(grid);
  grid.replaceChildren();
  $("#private").hidden = true;
  $("#gate").hidden = false;
  message(reason);
}

async function showGallery(user) {
  if (loading) return;
  loading = true;
  const attempt = ++generation;
  try {
    const [state, me] = await Promise.all([
      getDocFromServer(stateRef),
      getDocFromServer(doc(db, "gallery_access", user.uid))
    ]);
    const event = state.data(), access = me.data();
    if (!event?.active) throw new Error("The gallery is closed.");
    if (access?.eventId !== event.eventId || access.expiresAt.toMillis() <= Date.now())
      throw new Error("Ask the DJ for a current invite code.");
    const expiry = access.expiresAt.toMillis();
    const snap = await getDocsFromServer(query(collection(db, "media_queue"),
      where("eventId", "==", event.eventId), where("v", "==", 3)));
    if (generation !== attempt) return;
    if (expiry <= Date.now()) throw new Error("Your gallery pass expired.");
    $("#gate").hidden = true;
    $("#private").hidden = false;
    $("#timeLeft").textContent = "Guest access expires at " +
      new Date(expiry).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    stopState = onSnapshot(stateRef, current => {
      const state = current.data();
      if (!state?.active || state.eventId !== event.eventId) hideGallery("This gallery has closed.");
    }, () => hideGallery("Gallery access could not be verified."));
    expiryTimer = setTimeout(() => hideGallery("Your gallery pass expired."), expiry - Date.now());
    previews = previewWhenVisible(app, grid, (_, media) => {
      media.replaceWith(document.createTextNode("Preview unavailable"));
    });

    for (const row of snap.docs.sort((a, b) => (b.data().timestamp?.toMillis() || 0) - (a.data().timestamp?.toMillis() || 0))) {
      const item = row.data();
      const card = document.createElement("article");
      card.className = "card";
      const media = document.createElement(item.type === "video" ? "video" : "img");
      media.dataset.storagePath = item.storagePath;
      if (item.type === "video") {
        media.controls = true;
        media.playsInline = true;
      } else media.alt = "Party memory";
      const info = document.createElement("div");
      info.className = "info";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = item.name || "Guest";
      const save = document.createElement("button");
      save.className = "like";
      save.textContent = "Save original";
      save.onclick = async () => {
        save.disabled = true;
        try {
          const url = await privateMediaUrl(app, item.storagePath);
          if (generation !== attempt) { URL.revokeObjectURL(url); return; }
          const link = document.createElement("a");
          link.href = url;
          link.download = "party-memory";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (error) { alert(error.message); }
        finally { save.disabled = false; }
      };
      const like = document.createElement("button");
      like.className = "like";
      like.textContent = "♥ " + (item.likes || 0);
      like.onclick = async () => {
        like.disabled = true;
        try {
          const result = await httpsCallable(fn, "likeGalleryMedia")({ id: row.id });
          like.textContent = "♥ " + result.data.likes;
        } catch (error) { alert(error.message); like.disabled = false; }
      };
      info.append(who, save, document.createElement("br"), like);
      card.append(media, info);
      grid.append(card);
      previews.observe(media);
    }
    $("#galleryStatus").textContent = snap.empty ? "No photos or videos have been uploaded for this event yet." : "";
  } catch (error) {
    if (generation === attempt) hideGallery(error.message || "Could not open gallery.");
  } finally { loading = false; }
}

$("#codeForm").onsubmit = async event => {
  event.preventDefault();
  if (loading || redeeming) return;
  const code = $("#code").value.trim();
  if (!/^[0-9]{8}$/.test(code)) { message("Enter all eight digits."); return; }
  redeeming = true;
  $("#unlock").disabled = true;
  message("Checking your invitation…");
  try {
    await auth.authStateReady();
    const user = auth.currentUser || (await signInAnonymously(auth)).user;
    await httpsCallable(fn, "redeemGalleryCode")({ code });
    $("#code").value = "";
    await showGallery(user);
  } catch (error) { message(error.message || "Code rejected."); }
  finally { redeeming = false; $("#unlock").disabled = false; }
};

$("#leave").onclick = async () => {
  hideGallery("Session ended. Ask for another code to return.");
  await signOut(auth);
};
onAuthStateChanged(auth, user => { if (user && !redeeming) showGallery(user); });
</script></body></html>
