<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Album - Download Portal</title>
<style>
body {
background-color: #001a00;
color: white;
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
text-align: center;
}
h1 {
color: #ccff00;
font-size: 2.5rem;
text-transform: uppercase;
text-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
}
#gallery-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 20px;
padding: 20px;
max-width: 1400px;
margin: 0 auto;
}
.media-card {
background-color: #002b00;
border: 2px solid #ccff00;
border-radius: 12px;
overflow: hidden;
display: flex;
flex-direction: column;
}
.media-container {
width: 100%;
height: 250px;
background-color: black;
display: flex;
align-items: center;
justify-content: center;
}
.media-container img, .media-container video {
width: 100%;
height: 100%;
object-fit: contain;
}
.card-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.uploader-name { font-weight: bold; color: #ccff00; margin: 0; }
.download-btn {
background-color: #ccff00;
color: black;
text-decoration: none;
padding: 10px;
border-radius: 6px;
font-weight: bold;
text-transform: uppercase;
}
#loading, #empty-message { font-size: 1.5rem; color: #ccff00; margin-top: 50px; }
</style>
</head>
<body>

<h1>Party Album</h1>
<p>View and download the memories from tonight!</p>

<div id="loading">Loading the album...</div>
<div id="empty-message" style="display: none;">No media has been uploaded yet.</div>
<div id="gallery-grid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ⚠️ REPLACE THIS WITH YOUR REAL FIREBASE CONFIG ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById('gallery-grid');
const loading = document.getElementById('loading');
const emptyMessage = document.getElementById('empty-message');

async function loadGallery() {
try {
const q = query(collection(db, "media_queue"), orderBy("timestamp", "asc"));
const querySnapshot = await getDocs(q);

loading.style.display = 'none';

if (querySnapshot.empty) {
emptyMessage.style.display = 'block';
return;
}

querySnapshot.forEach((doc) => {
const data = doc.data();
const card = document.createElement('div');
card.className = 'media-card';

let mediaElement = data.type === 'video'
? `<video src="${data.url}" controls preload="metadata"></video>`
: `<img src="${data.url}" alt="Photo">`;

card.innerHTML = `
<div class="media-container">${mediaElement}</div>
<div class="card-info">
<p class="uploader-name">Uploaded by: ${data.name}</p>
<a href="${data.url}" download="${data.name}-party-media" target="_blank" class="download-btn">Download</a>
</div>
`;
grid.appendChild(card);
});
} catch (error) {
console.error("Error loading gallery: ", error);
loading.innerText = "Error loading gallery.";
}
}
loadGallery();
</script>
</body>
</html>
