<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox — DJ Sunny</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0d3d0d 0%, #1a5c1a 25%, #2d7a2d 50%, #1a5c1a 75%, #0d3d0d 100%);
      color: #fff;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #FFD700;
      letter-spacing: 3px;
      text-shadow: 0 0 24px rgba(255,215,0,0.6), 3px 3px 6px rgba(0,0,0,0.8);
      animation: neonPulse 2.5s ease-in-out infinite;
    }
    .title-sub {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #FF7AC6;
      text-transform: lowercase;
      text-shadow: 0 0 14px rgba(255,122,198,0.6);
      margin: 6px 0 36px;
    }
    .title-sub em { color: #FFD700; font-style: italic; font-weight: 700; }
    @keyframes neonPulse {
      0%, 100% { text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.6), 0 0 100px rgba(255,215,0,0.3); }
      50%       { text-shadow: 0 0 10px rgba(255,215,0,0.3), 0 0 20px rgba(255,215,0,0.1); }
    }
    .menu { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 360px; }
    .btn {
      display: block;
      text-decoration: none;
      padding: 22px 20px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-request {
      background: linear-gradient(135deg, #FFD700, #f5c518);
      color: #1a1a1a;
      box-shadow: 0 6px 24px rgba(255,215,0,0.35);
    }
    .btn-request:hover { box-shadow: 0 8px 32px rgba(255,215,0,0.55); }
    .btn-display {
      background: rgba(0,0,0,0.55);
      color: #FF7AC6;
      border: 2px solid #FF7AC6;
      box-shadow: 0 6px 24px rgba(255,122,198,0.25);
    }
    .btn-display:hover { box-shadow: 0 8px 32px rgba(255,122,198,0.45); }
    .btn-sub { display: block; font-size: 13px; font-weight: 500; opacity: 0.75; margin-top: 4px; letter-spacing: 0.5px; }
    .footer { margin-top: 40px; font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="title">🎶 JUKEBOX 🎶</div>
  <div class="title-sub">↳ where <em>you're</em> in control</div>

  <div class="menu">
    <a class="btn btn-request" href="song_request_form.html">
      🎤 REQUEST A SONG
      <span class="btn-sub">add your track to the queue</span>
    </a>
    <a class="btn btn-display" href="live-display-neon-final.html">
      📺 LIVE DISPLAY
      <span class="btn-sub">the big screen view</span>
    </a>
  </div>

  <div class="footer">DJ SUNNY · @eatitall</div>
</body>
</html>
