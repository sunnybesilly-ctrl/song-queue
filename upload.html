<div id="media-container"></div>

<style>
body {
margin: 0;
background: #020a05;
color: #ccff00;
font-family: Arial, sans-serif;
overflow: hidden;
}

#media-container {
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

#media-container img,
#media-container video {
width: 100%;
height: 100%;
object-fit: contain;
}

.empty-screen {
text-align: center;
font-size: 3vw;
color: #ccff00;
text-shadow: 0 0 15px #39ff14;
}

.empty-screen img {
display: block;
width: 300px;
height: 300px;
margin: 30px auto;
}
</style>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
onSnapshot,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// KEEP YOUR EXISTING FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("media-container");

const uploadURL = new URL("upload.html", location.href).href;

let mediaItems = [];
let currentIndex = 0;
let isPlaying = false;

const mediaQuery = query(
collection(db, "media_queue"),
orderBy("timestamp", "asc")
);

function showEmptyScreen() {
container.innerHTML = `
<div class="empty-screen">
<h1>SCAN TO ADD TO ALBUM</h1>
<img
src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(uploadURL)}"
alt="Upload QR Code"
>
<p>UPLOAD YOUR PARTY PHOTOS & VIDEOS</p>
</div>
`;
}

function showMedia(item) {
container.innerHTML = "";

if (item.type?.startsWith("video/")) {
const video = document.createElement("video");

video.src = item.url;
video.autoplay = true;
video.muted = true;
video.playsInline = true;
video.controls = false;

video.onended = () => nextMedia();

video.onerror = () => nextMedia();

container.appendChild(video);

video.play().catch(() => nextMedia());

} else {
const img = document.createElement("img");

img.src = item.url;
img.alt = "Party photo";

container.appendChild(img);

setTimeout(() => {
nextMedia();
}, 10000);
}
}

function nextMedia() {
if (!mediaItems.length) {
showEmptyScreen();
return;
}

currentIndex = (currentIndex + 1) % mediaItems.length;

showMedia(mediaItems[currentIndex]);
}

function startSlideshow() {
if (isPlaying || !mediaItems.length) return;

isPlaying = true;
currentIndex = 0;

showMedia(mediaItems[currentIndex]);
}

// Initial fetch of ALL existing media
async function loadInitialMedia() {
const snapshot = await getDocs(mediaQuery);

mediaItems = snapshot.docs.map(doc => ({
id: doc.id,
...doc.data()
}));

if (mediaItems.length) {
startSlideshow();
} else {
showEmptyScreen();
}
}

// Listen for new uploads in real time
onSnapshot(mediaQuery, snapshot => {

mediaItems = snapshot.docs.map(doc => ({
id: doc.id,
...doc.data()
}));

if (!mediaItems.length) {
isPlaying = false;
showEmptyScreen();
return;
}

if (!isPlaying) {
startSlideshow();
}

});

loadInitialMedia().catch(console.error);

</script>
