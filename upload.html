<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload to the Party Album</title>
<style>
body {
margin: 0;
padding: 20px;
background: #020a05;
color: #ccff00;
font-family: Arial, sans-serif;
text-align: center;
}
.container {
max-width: 400px;
margin: 50px auto;
background: #001a00;
padding: 30px;
border-radius: 15px;
border: 2px solid #ccff00;
box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
}
h1 { margin-top: 0; font-size: 2rem; text-transform: uppercase; }
input[type="text"], input[type="file"] {
width: 90%;
padding: 12px;
margin: 15px 0;
background: #000;
border: 1px solid #ccff00;
color: white;
border-radius: 5px;
}
button {
width: 100%;
padding: 15px;
background: #ccff00;
color: black;
border: none;
font-size: 1.2rem;
font-weight: bold;
border-radius: 5px;
cursor: pointer;
text-transform: uppercase;
margin-top: 10px;
}
button:disabled { background: #555; color: #888; cursor: not-allowed; }
#status { margin-top: 20px; font-weight: bold; font-size: 1.1rem; color: white; }
</style>
</head>
<body>

<div class="container">
<h1>Send to the Album</h1>
<p>Add a photo or video to the projector!</p>

<input type="text" id="nameInput" placeholder="Your Name" required>
<input type="file" id="fileInput" accept="image/*,video/*" required>

<button id="uploadBtn" onclick="uploadMedia()">Upload</button>
<div id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// ⚠️ REPLACE THIS WITH YOUR REAL FIREBASE CONFIG ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.uploadMedia = async function() {
const name = document.getElementById('nameInput').value;
const file = document.getElementById('fileInput').files[0];
const status = document.getElementById('status');
const btn = document.getElementById('uploadBtn');

if (!name || !file) {
status.innerText = "Please enter your name and select a file.";
return;
}

btn.disabled = true;
status.innerText = "Uploading... Please wait!";

try {
// 1. Upload file to Storage
const storageRef = ref(storage, 'party_media/' + Date.now() + '_' + file.name);
await uploadBytes(storageRef, file);

// 2. Get URL
const downloadURL = await getDownloadURL(storageRef);

// 3. Save to Firestore
await addDoc(collection(db, "media_queue"), {
name: name,
url: downloadURL,
type: file.type.startsWith('video') ? 'video' : 'image',
timestamp: serverTimestamp()
});

status.innerText = "Success! Look at the projector!";
document.getElementById('nameInput').value = '';
document.getElementById('fileInput').value = '';
} catch (error) {
console.error(error);
status.innerText = "Error uploading. Try again.";
}

btn.disabled = false;
}
</script>
</body>
</html>
