<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04140A">
<title>Drop your shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#04140A; --deep:#020A05; --bog:#0B2615; --line:#1F6B3A;
  --acid:#F4FF1A; --lime:#37FF76; --bone:#E9FFEA; --dim:#7FB391; --alarm:#FF4058;
  --display:"Big Shoulders Display",sans-serif; --body:"Familjen Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--deep)}
body{
  min-height:100vh;min-height:100dvh; font-family:var(--body);font-size:16px;line-height:1.45;color:var(--bone);
  background: radial-gradient(130% 55% at 100% 100%,rgba(55,255,118,.24),transparent 62%), radial-gradient(90% 45% at 0% 0%,rgba(244,255,26,.12),transparent 58%), linear-gradient(180deg,var(--deep) 0%,var(--base) 100%);
  background-attachment:fixed; overflow-x:hidden;
}
.floor{
  position:fixed;left:-20%;right:-20%;bottom:0;height:70vh;pointer-events:none;z-index:0;opacity:.5;
  background: repeating-linear-gradient(90deg,rgba(55,255,118,.35) 0 1px,transparent 1px 56px), repeating-linear-gradient(0deg,rgba(55,255,118,.35) 0 1px,transparent 1px 56px);
  transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%); mask-image:linear-gradient(to top,#000 0%,transparent 85%);
}
.grain{
  position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:1;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.wrap{ position:relative;z-index:2;max-width:480px;margin:0 auto; padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 56px) 20px; }
.title{
  font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(104px,34vw,176px);line-height:.8;letter-spacing:-.01em;color:var(--acid);
  transform:rotate(-4deg);transform-origin:0 100%;margin:6px 0 30px -4px;
}
.title span{display:block;opacity:.14;animation:tube 1.5s steps(1,end) forwards}
.title span:nth-child(1){animation-delay:.15s}
.title span:nth-child(2){margin-left:11%;animation-delay:.55s}
.title span:nth-child(3){margin-left:3%;animation-delay:.95s}
@keyframes tube{
  0%{opacity:.14;text-shadow:none}
  14%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
  22%{opacity:.18;text-shadow:none}
  30%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
  38%{opacity:.3;text-shadow:none}
  46%,100%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
}
.lede{max-width:28ch;margin:0 0 4px 4px;padding-left:12px;border-left:3px solid var(--lime);color:var(--dim);font-size:17px}
.step{margin-top:28px;padding-top:14px;border-top:2px solid var(--line)}
.step.s2{margin-left:16px}
.step.s3{margin-left:6px}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.num{font-family:var(--display);font-weight:900;font-size:54px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--lime);margin-right:12px}
.sl{font-weight:700;font-size:18px;color:var(--acid);margin-right:10px}
.sn{font-size:14px;color:var(--dim)}
.in{
  display:block;width:100%;-webkit-appearance:none;appearance:none;border-radius:0;outline:none;
  background:rgba(2,10,5,.75);border:2px solid var(--line);color:var(--bone);
  font-family:var(--body);font-weight:700;font-size:21px;padding:14px;
  transition:border-color .15s,box-shadow .15s;
}
.in::placeholder{color:#3F7655;font-weight:400}
.in:focus{border-color:var(--acid);box-shadow:0 0 0 3px rgba(244,255,26,.16),0 0 26px rgba(244,255,26,.16)}
.in:disabled{opacity:.55}
.drop{
  display:block;position:relative;min-height:176px;overflow:hidden;cursor:pointer;padding:16px;
  border:2px dashed var(--acid);
  background:repeating-linear-gradient(135deg,rgba(244,255,26,.06) 0 10px,transparent 10px 20px);
}
.drop::after{
  content:"+";position:absolute;right:12px;top:-18px;pointer-events:none;
  font-family:var(--display);font-weight:900;font-size:150px;line-height:1;
  color:transparent;-webkit-text-stroke:1.5px var(--lime);opacity:.5;
}
.drop input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.drop-idle{display:block}
.drop-big{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:64px;line-height:.84;color:var(--acid)}
.drop-sm{display:block;margin-top:14px;max-width:24ch;color:var(--dim);font-size:15px}
.prev{display:block}
.prev img,.prev video{display:block;width:100%;max-height:280px;object-fit:cover;background:#000}
.meta{display:block;padding:10px 14px;font-size:14px;color:var(--dim);word-break:break-all}
.editor{margin-top:14px;padding:16px;background:rgba(2,10,5,.78);border:1px solid var(--line)}
.editor h3{font-family:var(--display);font-size:30px;line-height:1;color:var(--acid);text-transform:uppercase;margin-bottom:8px}
.editor p{font-size:14px;color:var(--dim);margin-bottom:12px}
.edit-source{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none}
.edit-stage{position:relative;margin:0 auto;background:#000;touch-action:none;user-select:none;cursor:crosshair}
.edit-stage canvas{display:block;width:100%;height:auto}
.crop-frame{position:absolute;border:2px solid var(--acid);box-shadow:0 0 0 100vmax #0009;pointer-events:none}
.edit-stage{overflow:hidden}
.crop-frame button{position:absolute;width:44px;height:44px;border:0;background:none;padding:0;pointer-events:auto;touch-action:none}
.crop-frame button::after{content:"";position:absolute;width:12px;height:12px;background:var(--acid);border:1px solid #101600}
.crop-frame [data-corner="nw"]{top:0;left:0;cursor:nwse-resize}
.crop-frame [data-corner="ne"]{top:0;right:0;cursor:nesw-resize}
.crop-frame [data-corner="sw"]{bottom:0;left:0;cursor:nesw-resize}
.crop-frame [data-corner="se"]{bottom:0;right:0;cursor:nwse-resize}
.crop-frame [data-corner^="n"]::after{top:0}
.crop-frame [data-corner^="s"]::after{bottom:0}
.crop-frame [data-corner$="w"]::after{left:0}
.crop-frame [data-corner$="e"]::after{right:0}
.crop-frame button:focus-visible,.edit-controls button:focus-visible{outline:2px solid white;outline-offset:-3px}
.edit-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.edit-controls[hidden],.edit-stage[hidden]{display:none}
.edit-controls button{min-height:44px;padding:6px 12px;border:1px solid var(--line);background:#020a05;color:var(--bone);font:inherit;cursor:pointer}
.edit-controls button:disabled{opacity:.5;cursor:default}
.edit-controls input{flex:1;min-width:55px;accent-color:var(--lime)}
#editDuration{font-size:14px;color:var(--bone);font-variant-numeric:tabular-nums}

.drop.has{padding:0;border-style:solid;border-color:var(--lime);background:var(--bog)}
.drop.has::after{display:none}
.drop.has .drop-idle{display:none}
.go-wrap{margin-top:6px;filter:drop-shadow(0 0 16px rgba(244,255,26,.4))}
.go-wrap.busy{filter:none}
.go{
  display:block;width:100%;-webkit-appearance:none;appearance:none;border:0;border-radius:0;cursor:pointer;
  background:var(--acid);color:#061207;
  font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:42px;line-height:1;
  padding:16px 20px 14px;text-align:left;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  transition:transform .08s;
}
.go:active{transform:translate(2px,2px)}
.go:disabled{background:#8A9210;cursor:default}
.go:focus-visible,.again:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.go.ghost{background:transparent;color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime);clip-path:none}
.meter{margin-top:16px}
.led{display:flex;height:22px}
.led i{flex:1;margin-right:3px;background:#0F2E1B}
.led i:last-child{margin-right:0}
.led i.on{background:var(--lime);box-shadow:0 0 10px rgba(55,255,118,.7)}
.led i.hot{background:var(--acid);box-shadow:0 0 10px rgba(244,255,26,.7)}
.status{margin-top:14px;min-height:22px;font-weight:700;font-size:15px;color:var(--dim)}
.status.err{color:var(--alarm);padding-left:10px;border-left:3px solid var(--alarm)}
.done{margin-top:6px;min-width:0}
.stamp{
  position:relative;display:grid;gap:.05em;margin:0 0 20px;padding:.21em .2em .25em;
  width:100%;box-sizing:border-box;overflow:hidden;border:2px solid var(--acid);
  font:900 clamp(43px,17vw,98px)/.87 var(--display);
  letter-spacing:-.035em;color:var(--acid);text-transform:uppercase;background:#102014;
  animation:stamp-in .55s cubic-bezier(.2,.8,.2,1) both;
}
.stamp span{display:block;position:relative}
.stamp::before{
  content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#f4ff1a30 49%,transparent 66%);
  transform:translateX(-125%);animation:stamp-sweep .95s .17s ease-out both;pointer-events:none;
}
@keyframes stamp-in{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes stamp-sweep{to{transform:translateX(125%)}}
.rank{font:700 clamp(17px,4.7vw,23px)/1.36 var(--body);color:var(--bone);margin:0 0 22px}
.shot-number{color:var(--lime);font:900 clamp(24px,8vw,38px)/1 var(--display)}
@media (prefers-reduced-motion:reduce){
  .title span{animation:none;opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
  .stamp,.stamp::before{animation:none}
}
</style>

<body>
<div class="floor"></div>
<div class="grain"></div>

<main class="wrap">
  <h1 class="title" id="uploadHeading"><span>Drop</span><span>your</span><span>shot.</span></h1>
  <p class="lede" id="uploadLede">Send a photo or video from your phone. It joins the album instantly!</p>

  <form id="form" novalidate>
    <div class="step s1">
      <div class="sh"><span class="num">1</span><label class="sl" for="name">Your name</label><span class="sn">shows with your shot</span></div>
      <input class="in" id="name" type="text" maxlength="24" placeholder="Who's sending this?" autocomplete="given-name" autocapitalize="words" enterkeyhint="done">
    </div>

    <div class="step s2">
      <div class="sh"><span class="num">2</span><span class="sl">Photo or video</span><span class="sn">your full video plays on screen</span></div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*,video/*" aria-label="Photo or video">
        <span class="drop-idle">
          <span class="drop-big">Tap<br>to pick</span>
          <span class="drop-sm">Choose from your camera roll or shoot a new one.</span>
        </span>
        <span class="prev" id="prev" hidden></span>
        <span class="meta" id="meta" hidden></span>
      </label>
      <div class="editor" id="editor" hidden>
        <h3 id="editorTitle">Edit your media</h3>
        <p id="editorHelp">Drag on the preview or move the corners to crop to any shape. Use the arrows to rotate.</p>
        <img id="editImage" hidden alt="">
        <video class="edit-source" id="editVideo" playsinline preload="auto" aria-hidden="true"></video>
        <div class="edit-stage" id="editStage" hidden>
          <canvas id="editCanvas" aria-label="Media preview"></canvas>
          <div class="crop-frame" id="cropFrame">
            <button type="button" data-corner="nw" aria-label="Crop top left. Use arrow keys to move."></button>
            <button type="button" data-corner="ne" aria-label="Crop top right. Use arrow keys to move."></button>
            <button type="button" data-corner="sw" aria-label="Crop bottom left. Use arrow keys to move."></button>
            <button type="button" data-corner="se" aria-label="Crop bottom right. Use arrow keys to move."></button>
          </div>
        </div>
        <div class="edit-controls" id="videoTools" hidden>
          <button type="button" id="editPlay">Play</button>
          <input type="range" id="editSeek" aria-label="Video position" min="0" max="0" step=".01" value="0">
          <span id="editDuration"></span>
        </div>
        <div class="edit-controls">
          <button type="button" id="rotateLeft">↶ Left</button>
          <button type="button" id="rotateRight">↷ Right</button>
          <button type="button" id="cropReset">Reset</button>
        </div>
      </div>
    </div>

    <div class="step s3">
      <div class="sh"><span class="num">3</span><span class="sl">Send it</span></div>
      <div class="go-wrap" id="goWrap">
        <button class="go" id="go" type="submit"><span id="goLabel">Send to the screen</span></button>
      </div>
      <div class="meter" id="meter" hidden><div class="led" id="led"></div></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </form>

  <section class="done" id="done" hidden>
    <h2 class="stamp" id="liveTitle" tabindex="-1"><span>You’re</span><span>Live!</span></h2>
    <p class="rank" id="rank" role="status"><span class="shot-number" id="shotNumber" hidden></span> <span id="liveMessage"></span></p>
    <div class="go-wrap"><button class="go ghost again" id="again" type="button">Send another</button></div>
  </section>

</main>

<script type="module">
import { createMediaEditor, mediaClock } from "./photo-wall-editor.js?v=20261118";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, setDoc, serverTimestamp, getCountFromServer, doc, getDoc, query, where, orderBy, endAt } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";
const CLOUDINARY_CLOUD_NAME = "yl4yzjh5";

// Existing Firebase project configuration retained.
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const createUpload = httpsCallable(getFunctions(app, "us-central1"), "createPhotoWallUpload");

const MAX_VIDEO_MB = 75;
const MAX_EDGE = 2048;
const SEGMENTS = 24;
const NAME_KEY = "photowall_name";
const UID_KEY = "photowall_uid";      
const LAST_KEY = "photowall_last";    

const $ = (s) => document.querySelector(s);
const form = $("#form"), nameIn = $("#name"), fileIn = $("#file"), drop = $("#drop");
const prev = $("#prev"), meta = $("#meta"), go = $("#go"), goWrap = $("#goWrap"), goLabel = $("#goLabel");
const meter = $("#meter"), led = $("#led"), statusEl = $("#status");
const done = $("#done"), again = $("#again"), shotNumber = $("#shotNumber"), liveMessage = $("#liveMessage");
let confirmationVersion = 0;
const mediaEditor = createMediaEditor($("#editor"));

for (let i = 0; i < SEGMENTS; i++) led.appendChild(document.createElement("i"));
const segs = led.children;

try { nameIn.value = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}

function guestId() {
  let id = "";
  try {
    id = localStorage.getItem(UID_KEY) || "";
    if (!id) { id = "g" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem(UID_KEY, id); }
  } catch (_) {}
  return id || ("g" + Date.now().toString(36));
}

let busy = false;
let objUrl = null;
function setPct(p) {
  const n = Math.round(p * SEGMENTS);
  for (let i = 0; i < SEGMENTS; i++) {
    segs[i].className = i < n ? (i >= SEGMENTS * 0.75 ? "hot" : "on") : "";
  }
  goLabel.textContent = "Uploading your memory — " + Math.round(p * 100) + "%";
}
function setBusy(b) {
  busy = b;
  mediaEditor.lock(b);
  go.disabled = b;
  nameIn.disabled = b;
  fileIn.disabled = b;
  goWrap.classList.toggle("busy", b);
  meter.hidden = !b;
  if (!b) goLabel.textContent = "Send to the screen";
}
function clearStatus() { statusEl.textContent = ""; statusEl.className = "status"; }
function fail(msg, focusEl) {
  statusEl.textContent = msg;
  statusEl.className = "status err";
  if (focusEl) focusEl.focus();
  return false;
}
function fmtSize(b) {
  return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
}
function clearPreview() {
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  prev.innerHTML = "";
  prev.hidden = true;
  meta.hidden = true;
  mediaEditor.clear();
  drop.classList.remove("has");
}

fileIn.addEventListener("change", () => {
  clearStatus();
  clearPreview();
  const f = fileIn.files && fileIn.files[0];
  if (!f) return;
  const isV = f.type.indexOf("video/") === 0;
  const isI = f.type.indexOf("image/") === 0;
  if (!isV && !isI) {
    fileIn.value = "";
    fail("That file type can't play on the screen. Pick a photo or a video.");
    return;
  }
  objUrl = URL.createObjectURL(f);
  const el = document.createElement(isV ? "video" : "img");
  if (isV) {
    el.muted = true;
    el.playsInline = true;
    el.preload = "metadata";
    el.src = objUrl + "#t=0.1";
  } else {
    el.alt = "";
    el.src = objUrl;
  }
  prev.appendChild(el);
  prev.hidden = false;
  meta.textContent = f.name + " (" + fmtSize(f.size) + "). Tap to change.";
  meta.hidden = false;
  drop.classList.add("has");
  mediaEditor.selected(objUrl, isV);
  if (isV && f.size > MAX_VIDEO_MB * 1048576) {
    fail("That video is " + fmtSize(f.size) + ". The limit is " + MAX_VIDEO_MB + " MB. Choose a smaller or shorter video.");
  }
});

function decodeViaImg(file) {
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); resolve(im); };
    im.onerror = (e) => { URL.revokeObjectURL(u); reject(e); };
    im.src = u;
  });
}

async function squeezeImage(file) {
  if (/gif|svg/.test(file.type)) return file;
  try {
    let bmp, w, h;
    try {
      bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      w = bmp.width; h = bmp.height;
    } catch (_) {
      bmp = await decodeViaImg(file);
      w = bmp.naturalWidth; h = bmp.naturalHeight;
    }
    const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
    const cw = Math.round(w * scale), ch = Math.round(h * scale);
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    c.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
    if (bmp.close) bmp.close();
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.86));
    if (!blob) return file;
    const keepable = /image\/(jpeg|png|webp)/.test(file.type);
    if (keepable && scale === 1 && blob.size >= file.size) return file;
    return new File([blob], "shot.jpg", { type: "image/jpeg" });
  } catch (e) {
    console.warn("Image squeeze skipped:", e);
    return file;
  }
}

function cloudinaryUpload(file, params, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("file", file);
    Object.entries(params).forEach(([key, value]) => fd.append(key, value));
    const x = new XMLHttpRequest();
    x.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let j = {};
      try { j = JSON.parse(x.responseText); } catch (_) {}
      if (x.status === 200) resolve(j);
      else reject(new Error((j.error && j.error.message) || "Cloudinary " + x.status));
    };
    x.onerror = () => reject(new Error("Network error"));
    x.send(fd);
  });
}

function finalUrl(r) {
  const originalUrl = r.secure_url.replace(/\/authenticated\/s--[^/]+--\//, "/authenticated/");
  if (r.resource_type === "video") {
    return originalUrl
     .replace("/authenticated/", "/authenticated/c_limit,w_1920,h_1080,q_auto,f_mp4,vc_h264,ac_aac/")
      .replace(/\.[^./]+$/, ".mp4");
  }
  return /^(jpe?g|png|webp|gif)$/i.test(r.format || "")
    ? originalUrl
    : originalUrl.replace(/\.[^./]+$/, ".jpg");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  clearStatus();

  const name = nameIn.value.trim().slice(0, 24);
  const file = fileIn.files && fileIn.files[0];
  if (!name) return fail("Add your name first.", nameIn);
  if (!file) return fail("Pick a photo or video first.");

  const isVideo = file.type.indexOf("video/") === 0;
  const isImage = file.type.indexOf("image/") === 0;
  if (!isVideo && !isImage) return fail("That file type can't play on the screen. Pick a photo or a video.");
  if (isVideo && file.size > MAX_VIDEO_MB * 1048576) {
    return fail("That video is " + fmtSize(file.size) + ". The limit is " + MAX_VIDEO_MB + " MB. Choose a smaller or shorter video.");
  }

  setBusy(true);
  setPct(0);

  try {
    try { localStorage.setItem(NAME_KEY, name); } catch (_) {}

    meter.hidden = true;
    goLabel.textContent = "Preparing your memory…";
    statusEl.textContent = "Getting everything ready.";
    const edited = await mediaEditor.prepare(file, MAX_EDGE, MAX_VIDEO_MB * 1048576, (elapsed, duration) => {
      goLabel.textContent = "Saving video edits";
      statusEl.textContent = mediaClock(elapsed) + " / " + mediaClock(duration) + " · Keep this tab open.";
    });
    const prepared = isImage && edited === file ? await squeezeImage(file) : edited;

    setPct(0);
    meter.hidden = false;
    statusEl.textContent = "Uploading your memory. The percentage tracks your file transfer.";
    const { data: upload } = await createUpload();
    const r = await cloudinaryUpload(prepared, upload.params, setPct);
    if (r.type !== "authenticated" || r.public_id !== upload.params.public_id) {
      throw new Error("The media provider did not confirm a private upload.");
    }
    meter.hidden = true;
    goLabel.textContent = "Getting your memory ready…";
    statusEl.textContent = "Almost ready for the live album.";
    const vid = r.resource_type === "video";
    const url = finalUrl(r);

    meter.hidden = true;
    goLabel.textContent = "Posting to the live album…";
    statusEl.textContent = "Adding your memory to the live feed…";
    const ref = doc(db, "media_queue", r.public_id);
    await setDoc(ref, {
      name: name,
      url: url,
      publicId: r.public_id,
      type: vid ? "video" : "image",
      timestamp: serverTimestamp(),
      likes: 0,
      rx: {},
      rxTotal: 0,
      uid: guestId(),
      eventId: upload.eventId,
      v: 3
    });
    try { localStorage.setItem(LAST_KEY, ref.id); } catch (_) {}

    const version = ++confirmationVersion;
    form.hidden = $("#uploadHeading").hidden = $("#uploadLede").hidden = true;
    shotNumber.hidden = true;
    liveMessage.textContent = "Shot posted. Keep an eye on the big screen!";
    done.hidden = false;
    window.scrollTo(0, 0);
    $("#liveTitle").focus({ preventScroll: true });

    if (upload.eventId) void (async () => {
      try {
        await auth.authStateReady();
        if (!auth.currentUser || version !== confirmationVersion) return;
        const posted = await getDoc(ref);
        if (!posted.exists() || !posted.data().timestamp) return;
        const eventShots = query(collection(db, "media_queue"), where("eventId", "==", upload.eventId),
          orderBy("timestamp"), endAt(posted));
        const number = (await getCountFromServer(eventShots)).data().count;
        if (version !== confirmationVersion || !number) return;
        shotNumber.textContent = "Shot #" + number;
        shotNumber.hidden = false;
      } catch (_) {
        // Confirmation is already visible. Only guests with event read access can look up the number.
      }
    })();
  } catch (err) {
    alert(err.message);
    console.error(err);
    fail("Post not confirmed: " + (err.message || "Unknown error") + ". Check gallery before retrying.");
  } finally {
    setBusy(false);
  }
});

again.addEventListener("click", () => {
  fileIn.value = "";
  clearPreview();
  clearStatus();
  setPct(0);
  confirmationVersion++;
  done.hidden = true;
  form.hidden = $("#uploadHeading").hidden = $("#uploadLede").hidden = false;
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
