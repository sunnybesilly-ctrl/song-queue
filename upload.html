<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Your Shot</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0a140c; background: radial-gradient(circle at top, #1a2e1d 0%, #050a06 100%); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 30px 20px; box-sizing: border-box; }
        .header-title { font-family: 'Anton', sans-serif; font-size: 22vw; line-height: 0.85; color: #e2ff00; text-shadow: 0 0 30px rgba(226, 255, 0, 0.4); margin: 0; letter-spacing: -1px; text-transform: uppercase; }
        @media (min-width: 500px) { .header-title { font-size: 110px; } }
        .subtitle-box { border-left: 4px solid #7dff4a; padding-left: 15px; margin: 30px 0; }
        .subtitle-box p { margin: 0; color: #a3bca3; font-size: 15px; line-height: 1.4; }
        .step { margin-bottom: 30px; position: relative; }
        .step-header { display: flex; align-items: baseline; margin-bottom: 10px; }
        .number { font-family: 'Anton', sans-serif; font-size: 32px; color: #e2ff00; margin-right: 10px; line-height: 1; }
        .step-title { font-weight: 600; font-size: 16px; color: #e2ff00; }
        .step-desc { font-size: 13px; color: #a3bca3; margin-left: 5px; }
        input[type="text"] { width: 100%; background: transparent; border: 1px solid #3a5a3e; border-radius: 4px; padding: 15px; color: white; font-size: 16px; font-family: 'Inter', sans-serif; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input[type="text"]:focus { border-color: #e2ff00; }
        .file-drop-zone { display: block; width: 100%; border: 2px dashed #e2ff00; background: repeating-linear-gradient(-45deg, #0a140c, #0a140c 10px, #142618 10px, #142618 20px); border-radius: 4px; padding: 30px 20px; text-align: center; cursor: pointer; box-sizing: border-box; position: relative; transition: background 0.3s; }
        .file-drop-zone:hover { background: repeating-linear-gradient(-45deg, #142618, #142618 10px, #1a2e1d 10px, #1a2e1d 20px); }
        .drop-text { font-family: 'Anton', sans-serif; font-size: 36px; color: #e2ff00; line-height: 1; margin-bottom: 5px; }
        .drop-plus { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 40px; color: #e2ff00; font-weight: 300; }
        .drop-subtext { color: #a3bca3; font-size: 13px; margin: 0; margin-top: 10px; }
        input[type="file"] { display: none; }
        button { width: 100%; background-color: #e2ff00; color: #000; font-family: 'Anton', sans-serif; font-size: 24px; padding: 15px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s, background-color 0.2s; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        #status { margin-top: 20px; text-align: center; font-weight: 600; color: #e2ff00; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">DROP<br>YOUR<br>SHOT.</h1>
        <div class="subtitle-box">
            <p>Send a photo or video from your phone. It joins the album instantly!</p>
        </div>
        <div class="step">
            <div class="step-header"><span class="number">1</span><span class="step-title">Your name</span><span class="step-desc">shows with your shot</span></div>
            <input type="text" id="nameInput" placeholder="Who's sending this?">
        </div>
        <div class="step">
            <div class="step-header"><span class="number">2</span><span class="step-title">Photo or video</span><span class="step-desc">videos play up to 30 seconds</span></div>
            <label for="fileInput" class="file-drop-zone" id="dropZone">
                <div class="drop-text" id="dropText">TAP<br>TO PICK</div>
                <div class="drop-plus">+</div>
                <p class="drop-subtext" id="dropSubtext">Choose from your camera roll or shoot a new one.</p>
            </label>
            <input type="file" id="fileInput" accept="image/*,video/*" onchange="updateFileName()">
        </div>
        <div class="step">
            <div class="step-header"><span class="number">3</span><span class="step-title">Send it</span></div>
            <button id="uploadBtn" onclick="uploadMedia()">Send to the screen</button>
            <div id="status"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ YOUR FIREBASE CONFIG ⚠️
        const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

        // ⚠️ YOUR CLOUDINARY CONFIG ⚠️
        const CLOUDINARY_CLOUD_NAME = "yl4yzjh5"; 
        const CLOUDINARY_UPLOAD_PRESET = "djparty"; // The preset you created

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.updateFileName = function() {
            const file = document.getElementById('fileInput').files[0];
            const dropText = document.getElementById('dropText');
            const dropSubtext = document.getElementById('dropSubtext');
            if (file) {
                dropText.innerHTML = "READY!";
                dropSubtext.innerText = file.name;
                dropText.style.color = "#7dff4a";
            }
        }

        window.uploadMedia = async function() {
            const name = document.getElementById('nameInput').value;
            const file = document.getElementById('fileInput').files[0];
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!name || !file) {
                status.innerText = "Please enter your name and pick a file.";
                return;
            }

            btn.disabled = true;
            status.innerText = "UPLOADING... PLEASE WAIT.";

            try {
                // 1. Send file to Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                // 2. Save to Firebase with exactly the right schema
                await addDoc(collection(db, "media_queue"), {
                    name: name,
                    url: data.secure_url,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    timestamp: serverTimestamp(),
                    likes: 0 // Crucial for the 3D display page!
                });

                status.innerText = "SUCCESS! LOOK AT THE PROJECTOR.";
                status.style.color = "#7dff4a";
                
                // Reset form
                document.getElementById('nameInput').value = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('dropText').innerHTML = "TAP<br>TO PICK";
                document.getElementById('dropSubtext').innerText = "Choose from your camera roll or shoot a new one.";
                document.getElementById('dropText').style.color = "#e2ff00";

            } catch (error) {
                console.error(error);
                status.innerText = "ERROR: " + error.message;
                status.style.color = "#ff4444";
            }
            
            btn.disabled = false;
        }
    </script>
</body>
</html>
