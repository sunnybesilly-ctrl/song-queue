<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Request Queue - Live Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d3d0d 0%, #1a5c1a 25%, #2d7a2d 50%, #1a5c1a 75%, #0d3d0d 100%);
      color: #fef3e2;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* Red paint background */
    .paint-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    
    .header {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #FFD700;
      box-shadow: 0 2px 0 #c8102e;
      position: relative;
      z-index: 1;
    }
    
    .title {
      font-size: 42px;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255,215,0,0.6), 3px 3px 6px rgba(0,0,0,0.8);
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    
    .total-stat {
      background: linear-gradient(135deg, #FFD700, #c8102e);
      color: #fff;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(255,215,0,0.4), 0 4px 12px rgba(0,0,0,0.5);
    }
    
    .live {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .dot {
      width: 14px;
      height: 14px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 24px #00ff00;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    
    .ticker-section {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: transparent;
      padding: 0 40px;
    }
    
    .ticker-wrapper {
      display: flex;
      animation: scroll 45s linear infinite;
      gap: 48px;
    }
    
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    
    .song-card {
      background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(200,16,46,0.15));
      border: 3px solid #FFD700;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 640px;
      box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.3s;
      position: relative;
      backdrop-filter: blur(22px);
    }
    
    .song-card:hover {
      background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(200,16,46,0.2));
      border-color: #FFD700;
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(255,215,0,0.3), 0 8px 24px rgba(0,0,0,0.6);
    }
    
    .thumbnail {
      width: 240px;
      height: 180px;
      border-radius: 12px;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 0 20px rgba(255,215,0,0.3), 0 4px 12px rgba(0,0,0,0.3);
      background: rgba(0,0,0,0.6);
    }
    
    .song-info { flex: 1; }
    
    .submission-time {
      font-size: 16px;
      color: #FFD700;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }
    
    .artist {
      font-size: 32px;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(255,215,0,0.5), 2px 2px 4px rgba(0,0,0,0.6);
    }
    
    .song-title {
      font-size: 24px;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.3;
      font-weight: 500;
    }
    
    .requester {
      font-size: 18px;
      color: #fff;
      font-weight: 600;
    }
    
    .chat-section {
      width: 420px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      border-left: 4px solid #FFD700;
      box-shadow: inset 3px 0 0 rgba(200,16,46,0.4), 0 0 20px rgba(255,215,0,0.1);
    }
    
    .chat-header {
      padding: 20px;
      background: linear-gradient(135deg, #1a5c1a, #0d3d0d);
      border-bottom: 3px solid #FFD700;
      font-size: 24px;
      font-weight: 700;
      color: #FFD700;
      text-align: center;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,215,0,0.4);
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .chat-messages::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, #FFD700, #c8102e);
      border-radius: 4px; 
    }
    
    .chat-message {
      border-radius: 10px;
      padding: 14px;
      animation: slideIn 0.4s ease-out;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .chat-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    
    .chat-name {
      font-size: 18px;
      font-weight: 700;
    }
    
    .chat-time {
      font-size: 15px;
      color: #FFD700;
      font-weight: 600;
    }
    
    .chat-text {
      font-size: 18px;
      color: #fff;
      line-height: 1.5;
      font-weight: 500;
    }
    
    /* User color classes */
    .user-0 { 
      background: linear-gradient(135deg, rgba(249,115,22,0.25), rgba(234,88,12,0.15));
      border-left: 4px solid #f97316;
    }
    .user-0 .chat-name { color: #fb923c; text-shadow: 0 0 8px rgba(249,115,22,0.4); }
    
    .user-1 { 
      background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(37,99,235,0.15));
      border-left: 4px solid #3b82f6;
    }
    .user-1 .chat-name { color: #93c5fd; text-shadow: 0 0 8px rgba(59,130,246,0.4); }
    
    .user-2 { 
      background: linear-gradient(135deg, rgba(236,72,153,0.25), rgba(219,39,119,0.15));
      border-left: 4px solid #ec4899;
    }
    .user-2 .chat-name { color: #f9a8d4; text-shadow: 0 0 8px rgba(236,72,153,0.4); }
    
    .user-3 { 
      background: linear-gradient(135deg, rgba(132,204,22,0.25), rgba(101,163,13,0.15));
      border-left: 4px solid #84cc16;
    }
    .user-3 .chat-name { color: #bef264; text-shadow: 0 0 8px rgba(132,204,22,0.4); }
    
    .user-4 { 
      background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(147,51,234,0.15));
      border-left: 4px solid #a855f7;
    }
    .user-4 .chat-name { color: #d8b4fe; text-shadow: 0 0 8px rgba(168,85,247,0.4); }
    
    .user-5 { 
      background: linear-gradient(135deg, rgba(14,165,233,0.25), rgba(2,132,199,0.15));
      border-left: 4px solid #0ea5e9;
    }
    .user-5 .chat-name { color: #7dd3fc; text-shadow: 0 0 8px rgba(14,165,233,0.4); }
    
    .comments-section {
      background: linear-gradient(90deg, rgba(0,0,0,0.75), rgba(26,61,26,0.6), rgba(200,16,46,0.5), rgba(0,0,0,0.75));
      padding: 16px 40px;
      border-top: 3px solid rgba(255,215,0,0.5);
      border-bottom: 3px solid rgba(255,215,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      min-height: 80px;
      position: relative;
      z-index: 1;
    }
    
    .comment-stat {
      border-radius: 12px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideGlow 0.6s ease-out;
      box-shadow: 0 0 20px rgba(255,215,0,0.3), 0 4px 14px rgba(0,0,0,0.5);
      border: 2px solid;
    }
    
    @keyframes slideGlow {
      0% { transform: translateX(-60px); opacity: 0; box-shadow: 0 0 0 rgba(255,215,0,0); }
      100% { transform: translateX(0); opacity: 1; }
    }
    
    .comment-stat:nth-child(1) { animation-delay: 0s; }
    .comment-stat:nth-child(2) { animation-delay: 0.1s; }
    .comment-stat:nth-child(3) { animation-delay: 0.2s; }
    .comment-stat:nth-child(4) { animation-delay: 0.3s; }
    .comment-stat:nth-child(5) { animation-delay: 0.4s; }
    .comment-stat:nth-child(6) { animation-delay: 0.5s; }
    
    .comment-stat.gold {
      background: linear-gradient(135deg, rgba(255,215,0,0.35), rgba(26,92,26,0.3));
      border-color: #FFD700;
    }
    
    .comment-stat.red {
      background: linear-gradient(135deg, rgba(200,16,46,0.35), rgba(26,92,26,0.3));
      border-color: #c8102e;
    }
    
    .comment-emoji {
      font-size: 20px;
    }
    
    .comment-text {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
    }
    
    .comment-count {
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }
    
    .comment-count.gold { color: #FFD700; }
    .comment-count.red { color: #c8102e; }
    
    .footer {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      border-top: 4px solid #FFD700;
      padding: 20px 40px;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      gap: 60px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -2px 0 #c8102e;
    }
    
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .qr-code {
      width: 110px;
      height: 110px;
      background: white;
      padding: 6px;
      border-radius: 12px;
      border: 3px solid #FFD700;
      box-shadow: 0 0 24px rgba(255,215,0,0.6);
      transition: all 0.3s;
    }
    
    .qr-code:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255,215,0,0.8);
    }
    
    .qr-label {
      font-size: 15px;
      color: #FFD700;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,215,0,0.4);
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(254, 243, 226, 0.5);
      font-size: 18px;
    }
  </style>
</head>

  <script>
    const SONG_QUEUE_URL = 'https://script.google.com/macros/s/AKfycbwhV0ZdZXXMLPH303L8ttpZCY1Oj6Yh3aM7vw9tJbXFf-FshLDGrZzHR3OOx_O2Eu1_qA/exec';
    const CHAT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzLchhs-0VbGNvqZNX1iSeHwkTqLQy4Ndj22zdxB3DaJhWuZu9-b8MBHMTFYe7vbPS6/exec';
    const REFRESH_INTERVAL = 10;
    
    const CHECKBOX_OPTIONS = [
      { full: "Thank you, Sunny.", partial: "Thank you", emoji: "💕" },
      { full: "Sunny, you're the best", partial: "you're the best", emoji: "✨" },
      { full: "I'm stealing", partial: "stealing", emoji: "😈" },
      { full: "I wanna hang out with Sunny again", partial: "hang out", emoji: "🎉" },
      { full: "Sunny, your breath stinks", partial: "breath stinks", emoji: "😷" },
      { full: "I want Sunny to take pictures and/or videos of me", partial: "pictures", emoji: "📸" }
    ];
    
    let allSongs = [];
    let lastMessageCount = 0;
    let userColorMap = {};
    let nextColorIndex = 0;
    
    async function fetchSongQueue() {
      try {
        const response = await fetch(SONG_QUEUE_URL);
        const songs = await response.json();
        
        if (!songs || songs.length === 0) {
          document.getElementById('totalCount').textContent = '0';
          return;
        }
        
        allSongs = songs.filter(s => s['SONG TITLE?'] && s["WHO'S THE ARTIST?"]);
        
        allSongs.sort((a, b) => {
          const timeA = new Date(a.Timestamp || 0);
          const timeB = new Date(b.Timestamp || 0);
          return timeA - timeB;
        });
        
        document.getElementById('totalCount').textContent = allSongs.length;
        
        displayQueue();
        displayCommentStats();
        
      } catch (error) {
        console.error('Error fetching queue:', error);
      }
    }
    
    function displayQueue() {
      const wrapper = document.getElementById('tickerWrapper');
      
      if (allSongs.length === 0) {
        wrapper.innerHTML = '<div class="empty-state">No requests yet...</div>';
        return;
      }
      
      const songsHTML = allSongs.map(song => createSongCard(song)).join('');
      wrapper.innerHTML = songsHTML + songsHTML;
    }
    
    function createSongCard(song) {
      const videoId = song['Video ID'] || '';
      const thumbnail = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
      
      const timestamp = new Date(song.Timestamp);
      const timeStr = timestamp.toLocaleTimeString('en-US', { 
        hour: 'numeric', 
        minute: '2-digit',
        hour12: true 
      });
      
      return `
        <div class="song-card">
          ${thumbnail ? `<img class="thumbnail" src="${thumbnail}" alt="Thumbnail">` : ''}
          <div class="song-info">
            <div class="submission-time">⏰ ${timeStr}</div>
            <div class="artist">${escapeHtml(song["WHO'S THE ARTIST?"])}</div>
            <div class="song-title">${escapeHtml(song['SONG TITLE?'])}</div>
            <div class="requester">Requested by ${escapeHtml(song["WHAT'S YOUR NAME?"])}</div>
          </div>
        </div>
      `;
    }
    
    function displayCommentStats() {
      const container = document.getElementById('commentsSection');
      const stats = {};
      
      CHECKBOX_OPTIONS.forEach(option => {
        stats[option.full] = 0;
      });
      
      allSongs.forEach(song => {
        const checkboxField = song['CHECK ONE'];
        if (!checkboxField) return;
        
        CHECKBOX_OPTIONS.forEach(option => {
          if (checkboxField.toLowerCase().includes(option.partial.toLowerCase())) {
            stats[option.full]++;
          }
        });
      });
      
      const statsHTML = CHECKBOX_OPTIONS
        .filter(option => stats[option.full] > 0)
        .map((option, index) => {
          const colorClass = index % 2 === 0 ? 'gold' : 'red';
          return `
            <div class="comment-stat ${colorClass}">
              <div class="comment-emoji">${option.emoji}</div>
              <div class="comment-text">
                <span class="comment-count ${colorClass}">${stats[option.full]} ${stats[option.full] === 1 ? 'person' : 'people'}</span> said "${option.full}"
              </div>
            </div>
          `;
        }).join('');
      
      container.innerHTML = statsHTML || '';
    }
    
    async function fetchChatMessages() {
      try {
        const response = await fetch(CHAT_SHEET_URL);
        const messages = await response.json();
        
        if (!messages || messages.length === 0) {
          document.getElementById('chatMessages').innerHTML = '<div class="empty-state">No messages yet...</div>';
          return;
        }
        
        const shouldScroll = messages.length > lastMessageCount;
        lastMessageCount = messages.length;
        
        displayChat(messages, shouldScroll);
        
      } catch (error) {
        console.error('Error fetching chat:', error);
      }
    }
    
    function getUserColor(name) {
      if (!userColorMap[name]) {
        userColorMap[name] = nextColorIndex;
        nextColorIndex = (nextColorIndex + 1) % 6;
      }
      return userColorMap[name];
    }
    
    function displayChat(messages, shouldAutoScroll) {
      const container = document.getElementById('chatMessages');
      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
      
      container.innerHTML = messages.map(msg => {
        const name = msg.name || 'Guest';
        const colorIndex = getUserColor(name);
        const time = new Date().toLocaleTimeString('en-US', { 
          hour: 'numeric', 
          minute: '2-digit',
          hour12: true 
        });
        
        return `
          <div class="chat-message user-${colorIndex}">
            <div class="chat-header-row">
              <div class="chat-name">${escapeHtml(name)}</div>
              <div class="chat-time">${time}</div>
            </div>
            <div class="chat-text">${escapeHtml(msg.message || '')}</div>
          </div>
        `;
      }).join('');
      
      if (wasAtBottom || shouldAutoScroll) {
        container.scrollTop = container.scrollHeight;
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    fetchSongQueue();
    fetchChatMessages();
    
    setInterval(() => {
      fetchSongQueue();
      fetchChatMessages();
    }, REFRESH_INTERVAL * 1000);
  </script>
</body>
</html>
