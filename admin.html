<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Control Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #050a06; color: white; font-family: 'Inter', sans-serif; padding: 20px; margin: 0; }
        h1 { font-family: 'Anton', sans-serif; color: #e2ff00; text-align: center; font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(226,255,0,0.5); }
        
        /* Emergency Upload Form */
        .inject-box { background: #111; border: 2px solid #e2ff00; border-radius: 10px; padding: 15px; max-width: 400px; margin: 0 auto 30px auto; text-align: center; box-shadow: 0 0 20px rgba(226,255,0,0.2); }
        .inject-box h3 { margin: 0 0 10px 0; color: #e2ff00; font-family: 'Anton', sans-serif; font-size: 1.5rem; letter-spacing: 1px; }
        .inject-box input { width: 90%; margin-bottom: 10px; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 5px; }
        .inject-box button { background: #e2ff00; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-family: 'Anton', sans-serif; font-size: 1.2rem; letter-spacing: 1px; }
        .inject-box button:disabled { background: #555; color: #888; cursor: not-allowed; }
        #inject-status { margin-top: 10px; font-size: 0.9rem; color: #7dff4a; font-weight: bold; }

        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: #0a140c; border: 1px solid #3a5a3e; padding: 10px 20px; border-radius: 8px; text-align: center; width: 100px; }
        .stat-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #e2ff00; }
        
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #111; border: 1px solid #333; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .card img, .card video { width: 100%; height: 120px; object-fit: cover; background: #000; }
        .card-info { padding: 10px; text-align: center; background: #1a1a1a; }
        .card p { margin: 0 0 5px 0; font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 8px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        
        #clear-all { display: block; width: 100%; max-width: 400px; margin: 30px auto 0 auto; padding: 15px; background: transparent; border: 2px solid #ff4444; color: #ff4444; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: 'Anton', sans-serif; letter-spacing: 1px; transition: 0.2s; }
        #clear-all:hover { background: #ff4444; color: white; }
    </style>
</head>
<body>
    <h1>CONTROL ROOM</h1>

    <!-- EMERGENCY UPLOAD FORM -->
    <div class="inject-box">
        <h3>🚨 INJECT MEDIA 🚨</h3>
        <input type="text" id="adminName" placeholder="Name (e.g. DJ Sunny)">
        <input type="file" id="adminFile" accept="image/*,video/*">
        <button id="injectBtn" onclick="injectMedia()">SEND TO SCREEN</button>
        <div id="inject-status"></div>
    </div>
    
    <div class="stats">
        <div class="stat-box">PHOTOS <span id="photo-count">0</span></div>
        <div class="stat-box">VIDEOS <span id="video-count">0</span></div>
    </div>

    <button id="clear-all" onclick="deleteAll()">🚨 WIPE THE QUEUE 🚨</button>
    <div id="grid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, deleteDoc, doc, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔒 PASSWORD LOCK
        const password = prompt("Enter Admin Password:");
        if (password !== "PartyTime2026") { // Change this to whatever you want
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px; font-family:sans-serif;'>Access Denied</h1>";
            throw new Error("Unauthorized access");
        }

        // ⚠️ YOUR FIREBASE CONFIG
        const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};
        
        // ⚠️ YOUR CLOUDINARY CONFIG
        const CLOUDINARY_CLOUD_NAME = "yl4yzjh5"; 
        const CLOUDINARY_UPLOAD_PRESET = "UPLOAD_PRESET"; 

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const grid = document.getElementById('grid');
        let photoCount = 0;
        let videoCount = 0;

        onSnapshot(collection(db, "media_queue"), (snapshot) => {
            grid.innerHTML = ''; 
            photoCount = 0; videoCount = 0;

            if (snapshot.empty) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#888;">Queue is empty.</p>';
                document.getElementById('photo-count').innerText = 0;
                document.getElementById('video-count').innerText = 0;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                if (data.type === 'video') videoCount++;
                else photoCount++;

                const card = document.createElement('div');
                card.className = 'card';

                let mediaHtml = data.type === 'video' ? `<video src="${data.url}" muted></video>` : `<img src="${data.url}">`;

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="card-info">
                        <p>${data.name}</p>
                        <p style="color:#e2ff00">❤️ ${data.likes || 0}</p>
                        <button class="delete-btn" onclick="deleteItem('${id}')">DELETE</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.getElementById('photo-count').innerText = photoCount;
            document.getElementById('video-count').innerText = videoCount;
        });

        window.injectMedia = async function() {
            const name = document.getElementById('adminName').value || "DJ Drop";
            const file = document.getElementById('adminFile').files[0];
            const btn = document.getElementById('injectBtn');
            const status = document.getElementById('inject-status');

            if (!file) { alert("Select a file first!"); return; }
            btn.disabled = true; status.innerText = "INJECTING...";

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                await addDoc(collection(db, "media_queue"), {
                    name: name,
                    url: data.secure_url,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    timestamp: serverTimestamp(),
                    likes: 0
                });

                status.innerText = "SUCCESS! IT'S ON THE SCREEN.";
                document.getElementById('adminFile').value = '';
            } catch (error) {
                console.error(error); status.innerText = "ERROR: " + error.message;
            }
            btn.disabled = false;
        }

        window.deleteItem = async function(docId) {
            if (!confirm("Delete this immediately?")) return;
            await deleteDoc(doc(db, "media_queue", docId));
        }

        window.deleteAll = async function() {
            if (!confirm("🚨 WIPE EVERYTHING? The screen will reset.")) return;
            const querySnapshot = await getDocs(collection(db, "media_queue"));
            for (const document of querySnapshot.docs) { await deleteDoc(doc(db, "media_queue", document.id)); }
        }
    </script>
</body>
</html>
