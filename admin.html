<meta name="apple-mobile-web-app-title" content="Control Room">

<style>
:root{--deep:#020A05;--base:#04140A;--line:#1F6B3A;--acid:#F4FF1A;--lime:#37FF76;--bone:#E9FFEA;--dim:#7FB391;--alarm:#FF4058;
  --display:"Big Shoulders Display",Impact,sans-serif;--body:"Familjen Grotesk",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:20px;min-height:100vh;color:var(--bone);font-family:var(--body);
  background:radial-gradient(120% 50% at 100% 100%,rgba(55,255,118,.2),transparent 62%),radial-gradient(90% 40% at 0% 0%,rgba(244,255,26,.1),transparent 58%),linear-gradient(180deg,var(--deep),var(--base));background-attachment:fixed}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--acid);text-align:center;font-size:60px;line-height:.9;margin:6px 0 20px;transform:rotate(-2deg)}
h2{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--lime);font-size:30px;margin:0 0 8px}
.inject{max-width:420px;margin:0 auto 26px;padding:16px;border:2px solid var(--acid);background:rgba(2,10,5,.8)}
.inject h3{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--acid);font-size:30px;margin:0 0 10px}
.inject input{display:block;width:100%;margin-bottom:10px;padding:11px;background:#000;border:2px solid var(--line);color:var(--bone);font-family:var(--body);font-size:16px;border-radius:0}
.go{display:block;width:100%;border:0;border-radius:0;cursor:pointer;background:var(--acid);color:#061207;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;padding:10px 16px 8px;text-align:left}
.go:disabled{background:#8A9210;cursor:default}
#injectStatus,#loginStatus{margin-top:10px;min-height:20px;font-weight:700;font-size:14px;color:var(--lime)}
#loginStatus.err{color:var(--alarm)}
#signOut{position:absolute;top:14px;right:14px;background:transparent;border:2px solid var(--line);color:var(--dim);font-family:var(--body);font-weight:700;font-size:13px;padding:6px 12px;border-radius:0;cursor:pointer}
.stats{display:flex;justify-content:center;margin-bottom:18px}
.stat{margin:0 8px;padding:10px 20px;border:2px solid var(--line);text-align:center;min-width:110px;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--dim)}
.stat span{display:block;font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--acid)}
#download-all{display:block;width:100%;max-width:420px;margin:0 auto 12px;padding:12px;background:var(--lime);border:2px solid var(--lime);color:#061207;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:26px;border-radius:0;cursor:pointer}
#download-all:hover{background:var(--acid);border-color:var(--acid)}
#download-all:disabled{background:var(--line);border-color:var(--line);color:var(--dim);cursor:default}
#clearAll{display:block;width:100%;max-width:420px;margin:0 auto;padding:12px;background:transparent;border:2px solid var(--alarm);color:var(--alarm);font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:26px;border-radius:0;cursor:pointer}
#clearAll:hover{background:var(--alarm);color:#fff}
.sigs{max-width:640px;margin:30px auto 0}
.sig{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sig .t{flex:1;min-width:0;font-size:15px;word-break:break-word}
.sig .t b{color:var(--acid);margin-right:8px}
.sig button,.del{background:var(--alarm);color:#fff;border:0;border-radius:0;padding:7px 12px;font-weight:700;cursor:pointer}
.sig button{margin-left:10px}
.empty{color:var(--dim);text-align:center;grid-column:1/-1}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:26px}
.card{position:relative;border:1px solid var(--line);background:#0a140c;display:flex;flex-direction:column}
.card img,.card video{display:block;width:100%;height:120px;object-fit:cover;background:#000}
.badge{position:absolute;left:6px;top:6px;background:var(--acid);color:#061207;font-weight:700;font-size:11px;padding:2px 6px;letter-spacing:.1em}
.info{padding:8px;text-align:center}
.info p{margin:0 0 6px;font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p.l{color:var(--acid)}
.del{width:100%}
.dl{display:block;margin-top:8px;padding:7px;border:2px solid var(--lime);color:var(--lime);text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.1em;text-align:center}
.dl:hover{background:var(--lime);color:#061207}
.stats{flex-wrap:wrap}
.stat{margin:0 4px 8px;padding:10px 14px;min-width:96px}
.brand{font-family:"Permanent Marker","Comic Sans MS",cursive;text-align:center;color:var(--dim);font-size:15px;margin:-8px 0 22px}
.brand b{color:#FFC21A;font-weight:400}
#clearRx{display:block;width:100%;max-width:420px;margin:0 auto 12px;padding:12px;background:transparent;border:2px solid #FFC21A;color:#FFC21A;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:26px;border-radius:0;cursor:pointer}
#clearRx:hover{background:#FFC21A;color:#1b1300}
.rxs{display:flex;flex-wrap:wrap;justify-content:center;margin:0 0 6px}
.rxp{margin:2px;padding:2px 6px;border:1px solid #FFC21A;color:#FFE45C;font-size:12px;font-weight:700}
.rxz{font-size:11px;color:var(--dim);letter-spacing:.08em}
.logb{display:block;width:100%;margin-bottom:6px;padding:6px;background:transparent;border:2px solid #FFC21A;color:#FFC21A;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.1em;cursor:pointer;border-radius:0}
.card.open{grid-column:1/-1}
.rxlog{padding:10px;border-top:2px solid #FFC21A;background:rgba(20,13,0,.7)}
.rxh{font-family:var(--display);font-weight:900;text-transform:uppercase;color:#FFC21A;font-size:22px;margin-bottom:6px}
.rxrow{display:flex;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rxrow .t{flex:1;min-width:0;font-size:15px;word-break:break-word}
.rxrow .t b{color:var(--acid);margin-right:8px}
.rxrow button{margin-left:8px;background:var(--alarm);color:#fff;border:0;border-radius:0;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
.rxrow button.alt{background:transparent;border:2px solid var(--alarm);color:var(--alarm)}
.go2{display:block;width:100%;margin-top:10px;padding:10px;background:transparent;border:2px solid var(--alarm);color:var(--alarm);font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:20px;border-radius:0;cursor:pointer}
.go2:hover{background:var(--alarm);color:#fff}
</style>
</head>
<body>
<button id="signOut" type="button" hidden>Sign out</button>
<h1>Control room</h1>
<p class="brand">-A Sunny <b>neverpartlycloudy</b> production</p>

<div class="inject" id="login">
  <h3>Sign in</h3>
  <input type="text" id="email" placeholder="Admin email" autocomplete="username" autocapitalize="none" inputmode="email">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <button class="go" id="loginBtn" type="button">Enter</button>
  <div id="loginStatus"></div>
</div>

<div id="app" hidden>
  <div class="inject">
    <h3>Inject media</h3>
    <input type="text" id="adminName" placeholder="Name (e.g. DJ Sunny)">
    <input type="file" id="adminFile" accept="image/*,video/*">
    <button class="go" id="injectBtn" type="button">Send to screen</button>
    <div id="injectStatus"></div>
  </div>

  <div class="inject"><h3>Screen control</h3><p id="overrideStatus">Normal slideshow</p><button id="resumeDisplay" type="button">Resume slideshow</button><p>Video cards below include Play once, Repeat, and Trim. No admin label appears on the public screen.</p></div>
  <div class="stats">
    <div class="stat">PHOTOS <span id="photoCount">0</span></div>
    <div class="stat">VIDEOS <span id="videoCount">0</span></div>
    <div class="stat">REACTIONS <span id="rxCount">0</span></div>
  </div>

  <button id="download-all" type="button" onclick="downloadAll()">📥 DOWNLOAD ALL MEDIA</button>
  <button id="clearRx" type="button">Wipe reactions only</button>
  <button id="clearAll" type="button">Wipe everything</button>

  <div class="sigs">
    <h2>Signatures</h2>
    <div id="sigList"></div>
  </div>

  <div id="grid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, getDocs, addDoc, serverTimestamp, query, orderBy, limit, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};
const CLOUD_NAME = "yl4yzjh5";
const UPLOAD_PRESET = "UPLOAD_PRESET";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---- sign in ---- */
try { $("email").value = localStorage.getItem("admin_email") || ""; } catch (e) {}
let started = false;
onAuthStateChanged(auth, (user) => {
  const ok = !!user;
  $("login").hidden = ok;
  $("app").hidden = !ok;
  $("signOut").hidden = !ok;
  if (ok && !started) { started = true; startApp(); }
});
async function doLogin() {
  const email = $("email").value.trim().toLowerCase();
  const pw = $("pw").value;
  const st = $("loginStatus"), btn = $("loginBtn");
  if (!email || !pw) { st.className = "err"; st.textContent = "Enter your email and password."; return; }
  btn.disabled = true; st.className = ""; st.textContent = "SIGNING IN...";
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    try { localStorage.setItem("admin_email", email); } catch (e) {}
    $("pw").value = ""; st.textContent = "";
  } catch (e) {
    st.className = "err";
    st.textContent = e.code === "auth/operation-not-allowed" ? "Email/Password sign-in is not enabled in Firebase yet."
      : (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found") ? "Wrong email or password."
      : "Sign in failed: " + (e.code || e.message);
  }
  btn.disabled = false;
}
$("loginBtn").addEventListener("click", doLogin);
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("signOut").addEventListener("click", () => signOut(auth));

/* ---- helpers ---- */
function thumb(m) {
  const u = m.url || "";
  const re = /\/upload\/(?:[^\/]+\/)?(?=v\d+\/)/;
  if (u.indexOf("res.cloudinary.com") < 0 || !re.test(u)) return "";
  const t = "c_fill,w_320,h_240,q_auto";
  if (m.type === "video") return u.replace(re, "/upload/so_1," + t + "/").replace(/\.[^.\/]+$/, ".jpg");
  return u.replace(re, "/upload/" + t + "/");
}
function finalUrl(r) {
  if (r.resource_type === "video") {
    return r.secure_url.replace("/upload/", "/upload/vc_h264,c_limit,w_1920,q_auto/").replace(/\.[^.\/]+$/, ".mp4");
  }
  const u = r.secure_url.replace("/upload/", "/upload/c_limit,w_2048,h_2048,q_auto/");
  return /^(jpe?g|png|webp|gif|svg)$/i.test(r.format || "") ? u : u.replace(/\.[^.\/]+$/, ".jpg");
}
function dlUrl(m, tag) {
  const u = m.url || "";
  if (u.indexOf("res.cloudinary.com") < 0 || u.indexOf("/upload/") < 0) return u;
  let n = String(m.name || "party").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "party";
  if (tag != null) n += "_" + tag;
  return u.replace("/upload/", "/upload/fl_attachment:" + n + "/");
}
async function warmVideo(url) {
  const end = Date.now() + 90000;
  while (Date.now() < end) {
    try {
      const r = await fetch(url, { headers: { Range: "bytes=0-0" } });
      if (r.ok || r.status !== 423) return;
    } catch (_) { return; }
    await new Promise((res) => setTimeout(res, 2500));
  }
}

/* ---- inject media (same MP4 / JPEG conversion as the guest page) ---- */
$("injectBtn").addEventListener("click", async () => {
  const name = $("adminName").value.trim() || "DJ Drop";
  const file = $("adminFile").files[0];
  const btn = $("injectBtn"), status = $("injectStatus");
  if (!file) { alert("Select a file first!"); return; }
  btn.disabled = true; status.textContent = "INJECTING...";
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);
    fd.append("tags", "party_media");
    const res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/auto/upload", { method: "POST", body: fd });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const vid = data.resource_type === "video";
    const url = finalUrl(data);
    if (vid) { status.textContent = "CONVERTING VIDEO..."; await warmVideo(url); }
    await addDoc(collection(db, "media_queue"), {
      name: name, url: url, publicId: data.public_id,
      type: vid ? "video" : "image", timestamp: serverTimestamp(), likes: 0
    });
    status.textContent = "SUCCESS! IT'S ON THE SCREEN.";
    $("adminFile").value = "";
  } catch (e) {
    console.error(e); status.textContent = "ERROR: " + e.message;
  }
  btn.disabled = false;
});

/* ---- wipe: photos, videos, reactions and signatures ---- */
$("clearAll").addEventListener("click", async () => {
  if (!confirm("WIPE EVERYTHING? Photos, videos, reactions and signatures. The screen will reset.")) return;
  try {
    await Promise.all(["media_queue", "reactions", "comments"].map(async (name) => {
      const s = await getDocs(collection(db, name));
      await Promise.all(s.docs.map((d) => deleteDoc(d.ref)));
    }));
  } catch (e) { alert(e.message); }
});

/* ---- wipe reactions only ---- */
$("clearRx").addEventListener("click", async () => {
  if (!confirm("WIPE ALL REACTIONS? Photos and videos stay.")) return;
  try {
    const sn = await getDocs(collection(db, "reactions"));
    await Promise.all(sn.docs.map((d) => deleteDoc(d.ref)));
  } catch (e) { alert(e.message); }
});

/* ---- live lists (start once after sign in) ---- */
/* ---- reactions: moderation + per-media logs ---- */
const RXI = { heart: "❤️", bolt: "⚡", star: "☀️", lol: "😂", wow: "😮", cool: "😎", sad: "😭", down: "👎" };
let mediaDocs = [], rxDocs = [], openId = null;
let displayOverride = null;
const overrideRef = doc(db, "display_control", "current");
async function setOverride(id, repeat) {
  try { await setDoc(overrideRef, { mediaId:id, repeat:!!repeat, active:true, changedAt:serverTimestamp(), by:auth.currentUser.uid }); }
  catch(e) { alert("Screen control failed: "+e.message); }
}
$("resumeDisplay").addEventListener("click", async () => {
  try { await setDoc(overrideRef, {active:false,mediaId:"",repeat:false,changedAt:serverTimestamp(),by:auth.currentUser.uid}); }
  catch(e) { alert("Resume failed: "+e.message); }
});
function videoControls(ref, data) {
  const wrap = h("div","videoctl");
  const once = h("button","go2","PLAY ONCE");
  once.addEventListener("click",()=>setOverride(ref.id,false));
  const repeat = h("button","go2","REPEAT UNTIL STOPPED");
  repeat.addEventListener("click",()=>setOverride(ref.id,true));
  wrap.appendChild(once); wrap.appendChild(repeat);
  const start = h("input"); start.type="number"; start.min="0"; start.step="0.1"; start.value=String(Math.max(0,Number(data.trimStart)||0)); start.title="Start seconds";
  const end = h("input"); end.type="number"; end.min="0"; end.step="0.1"; end.value=String(Math.max(0,Number(data.trimEnd)||0)); end.title="End seconds; zero means original ending";
  const save = h("button","go2","SAVE TRIM");
  save.addEventListener("click",async()=>{
    const s=Number(start.value),e=Number(end.value);
    if(!Number.isFinite(s)||!Number.isFinite(e)||s<0||e<0||(e>0&&e<=s)){alert("Invalid times. End must exceed start or be zero.");return;}
    try {await updateDoc(ref.ref,{trimStart:s,trimEnd:e});}
    catch(err){alert("Trim not saved: "+err.message);}
  });
  wrap.appendChild(h("p","l","Start / end in seconds (end 0 = full video)"));
  wrap.appendChild(start); wrap.appendChild(end); wrap.appendChild(save);
  return wrap;
}
function rxName(d) { return String(d.name || d.who || d.user || d.by || "Guest").trim().slice(0, 24) || "Guest"; }
function rxWhen(d) { try { return d.t && d.t.toDate ? d.t.toDate().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "now"; } catch (e) { return ""; } }
function tsec(r) { const t = r.data().t; return t && t.seconds ? t.seconds : 0; }
function rxFor(id) { return rxDocs.filter((r) => r.data().mediaId === id); }
function rxSum(list) {
  const c = {}; let n = 0;
  list.forEach((r) => { const m = r.data().c || {}; Object.keys(RXI).forEach((k) => { const v = +m[k] || 0; if (v) { c[k] = (c[k] || 0) + v; n += v; } }); });
  return { c: c, n: n };
}
async function delRx(refs, msg) {
  if (!refs.length || !confirm(msg)) return;
  try { await Promise.all(refs.map((r) => deleteDoc(r.ref || r))); } catch (e) { alert(e.message); }
}
function logPanel(d, list) {
  const p = h("div", "rxlog");
  p.appendChild(h("div", "rxh", "Reaction log - " + (d.data().name || "Unnamed")));
  if (!list.length) p.appendChild(h("p", "empty", "No reactions yet."));
  list.slice().sort((a, b) => tsec(b) - tsec(a)).forEach((r) => {
    const x = r.data(), row = h("div", "rxrow"), t = h("div", "t");
    const kinds = Object.keys(RXI).filter((k) => +(x.c || {})[k]).map((k) => RXI[k] + (+x.c[k] > 1 ? "x" + x.c[k] : "")).join(" ");
    t.appendChild(h("b", "", rxName(x)));
    t.appendChild(document.createTextNode(kinds + "  " + rxWhen(x)));
    const by = h("button", "alt", "ALL BY NAME");
    by.addEventListener("click", () => delRx(rxDocs.filter((q) => rxName(q.data()) === rxName(x)), "Delete EVERY reaction from " + rxName(x) + "?"));
    const del = h("button", "", "DEL");
    del.addEventListener("click", () => delRx([r], "Delete this reaction?"));
    row.appendChild(t); row.appendChild(by); row.appendChild(del);
    p.appendChild(row);
  });
  if (list.length) {
    const clr = h("button", "go2", "Clear all reactions on this media");
    clr.addEventListener("click", () => delRx(list, "Clear all " + list.length + " reactions on this media?"));
    p.appendChild(clr);
  }
  return p;
}
function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  let photos = 0, videos = 0;
  if (!mediaDocs.length) { grid.appendChild(h("p", "empty", "Queue is empty.")); }
  mediaDocs.forEach((d) => {
    const data = d.data();
    const isV = data.type === "video";
    if (isV) videos++; else photos++;
    const card = h("div", "card");
    const t = thumb(data);
    let media;
    if (t || !isV) { media = document.createElement("img"); media.alt = ""; media.loading = "lazy"; media.src = t || data.url; }
    else { media = document.createElement("video"); media.muted = true; media.preload = "metadata"; media.playsInline = true; media.src = data.url + "#t=0.5"; }
    card.appendChild(media);
    if (isV) card.appendChild(h("div", "badge", "VIDEO"));
    const info = h("div", "info");
    info.appendChild(h("p", "", data.name || "Unnamed"));
    info.appendChild(h("p", "l", "LIKES " + (data.likes || 0)));
    const list = rxFor(d.id), sum = rxSum(list), rs = h("div", "rxs");
    Object.keys(sum.c).forEach((k) => rs.appendChild(h("span", "rxp", RXI[k] + " " + sum.c[k])));
    if (!sum.n) rs.appendChild(h("span", "rxz", "NO REACTIONS"));
    info.appendChild(rs);
    const lb = h("button", "logb", (openId === d.id ? "HIDE LOG" : "LOG") + " (" + list.length + ")");
    lb.addEventListener("click", () => { openId = openId === d.id ? null : d.id; renderGrid(); });
    info.appendChild(lb);
    if(isV) info.appendChild(videoControls(d,data));
    const del = h("button", "del", "DELETE");
    del.addEventListener("click", async () => {
      if (!confirm("Delete this immediately?")) return;
      try { await deleteDoc(d.ref); } catch (e) { alert(e.message); }
    });
    info.appendChild(del);
    const dl = h("a", "dl", "DOWNLOAD");
    dl.href = dlUrl(data, d.id.slice(0, 5));
    dl.setAttribute("download", "");
    info.appendChild(dl);
    card.appendChild(info);
    if (openId === d.id) { card.classList.add("open"); card.appendChild(logPanel(d, list)); }
    grid.appendChild(card);
  });
  $("photoCount").textContent = photos;
  $("videoCount").textContent = videos;
}

function startApp() {
  onSnapshot(overrideRef,(snap)=>{
    displayOverride=snap.exists()?snap.data():null;
    $("overrideStatus").textContent=displayOverride&&displayOverride.active?(displayOverride.repeat?"Repeating selected video":"Playing selected video once"):"Normal slideshow";
  },e=>{$("overrideStatus").textContent="Control read error: "+e.message;});
  onSnapshot(query(collection(db, "media_queue"), orderBy("timestamp", "desc")), (snap) => { mediaDocs = snap.docs; renderGrid(); }, (e) => console.warn(e));
  onSnapshot(collection(db, "reactions"), (snap) => { rxDocs = snap.docs; $("rxCount").textContent = rxSum(rxDocs).n; renderGrid(); }, (e) => console.warn(e));

  onSnapshot(query(collection(db, "comments"), orderBy("t", "desc"), limit(40)), (snap) => {
    const list = $("sigList");
    list.innerHTML = "";
    if (snap.empty) { list.appendChild(h("p", "empty", "No signatures yet.")); }
    snap.forEach((d) => {
      const c = d.data();
      const row = h("div", "sig"), t = h("div", "t");
      t.appendChild(h("b", "", c.name || "A guest"));
      t.appendChild(document.createTextNode(c.text || ""));
      const del = h("button", "", "DELETE");
      del.addEventListener("click", async () => { try { await deleteDoc(d.ref); } catch (e) { alert(e.message); } });
      row.appendChild(t); row.appendChild(del);
      list.appendChild(row);
    });
  }, (e) => console.warn(e));
}

/* ---- download everything ---- */
window.downloadAll = async function () {
  const btn = $("download-all");
  try {
    const snapshot = await getDocs(collection(db, "media_queue"));
    if (snapshot.empty) { alert("No media to download."); return; }
    if (!confirm("Download all " + snapshot.size + " items?")) return;
    btn.disabled = true;
    let delay = 0, i = 0;
    const total = snapshot.size;
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const n = ++i;
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = dlUrl(data, n);
        a.download = "";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (n === total) btn.disabled = false;
      }, delay);
      delay += 1000;
    });
  } catch (error) {
    console.error(error);
    alert("Failed.");
    btn.disabled = false;
  }
};
</script>
</body>
</html>
