<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04140A">
<title>Make some noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#04140A;--deep:#020A05;--bog:#0B2615;--line:#1F6B3A;
  --acid:#F4FF1A;--lime:#37FF76;--bone:#E9FFEA;--dim:#7FB391;--alarm:#FF4058;
  --display:"Big Shoulders Display",sans-serif;
  --body:"Familjen Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--deep)}
body{
  min-height:100vh;min-height:100dvh;
  font-family:var(--body);font-size:16px;line-height:1.45;color:var(--bone);
  background:
    radial-gradient(130% 55% at 100% 100%,rgba(55,255,118,.24),transparent 62%),
    radial-gradient(90% 45% at 0% 0%,rgba(244,255,26,.12),transparent 58%),
    linear-gradient(180deg,var(--deep) 0%,var(--base) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
.floor{
  position:fixed;left:-20%;right:-20%;bottom:0;height:70vh;pointer-events:none;z-index:0;opacity:.5;
  background:
    repeating-linear-gradient(90deg,rgba(55,255,118,.35) 0 1px,transparent 1px 56px),
    repeating-linear-gradient(0deg,rgba(55,255,118,.35) 0 1px,transparent 1px 56px);
  transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);
  mask-image:linear-gradient(to top,#000 0%,transparent 85%);
}
.wrap{
  position:relative;z-index:2;max-width:480px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 26px) 20px calc(env(safe-area-inset-bottom,0px) + 56px) 20px;
}
.title{
  font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(88px,29vw,150px);line-height:.8;letter-spacing:-.01em;color:var(--acid);
  transform:rotate(-4deg);transform-origin:0 100%;margin:6px 0 26px -4px;
}
.title span{display:block;opacity:.14;animation:tube 1.5s steps(1,end) forwards}
.title span:nth-child(1){animation-delay:.15s}
.title span:nth-child(2){margin-left:11%;animation-delay:.55s}
.title span:nth-child(3){margin-left:3%;animation-delay:.95s}
@keyframes tube{
  0%{opacity:.14;text-shadow:none}
  14%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
  22%{opacity:.18;text-shadow:none}
  30%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
  38%{opacity:.3;text-shadow:none}
  46%,100%{opacity:1;text-shadow:0 0 14px rgba(244,255,26,.75),0 0 48px rgba(244,255,26,.4)}
}
.now{display:flex;align-items:center;margin:0 0 4px 4px;padding-left:12px;border-left:3px solid var(--lime)}
.now img{display:block;width:64px;height:64px;object-fit:cover;margin-right:12px;background:#000}
.lab{font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.nname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:32px;line-height:1;color:var(--acid)}

.step{margin-top:26px;padding-top:14px;border-top:2px solid var(--line)}
.step.s2{margin-left:16px}
.step.s3{margin-left:6px}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.num{font-family:var(--display);font-weight:900;font-size:54px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--lime);margin-right:12px}
.sl{font-weight:700;font-size:18px;color:var(--acid);margin-right:10px}
.sn{font-size:14px;color:var(--dim)}

.rx{display:flex;flex-wrap:wrap;margin:0 -5px}
.rb{
  position:relative;-webkit-appearance:none;appearance:none;border:0;border-radius:0;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  background:rgba(2,10,5,.75);box-shadow:inset 0 0 0 2px var(--line);margin:5px;
  display:flex;align-items:center;justify-content:center;transition:box-shadow .1s,transform .06s;
}
.rb.big{flex:1 1 100%;height:150px}
.rb.sm{flex:1 1 calc(50% - 10px);height:84px}
.rb:active{transform:scale(.97);box-shadow:inset 0 0 0 3px var(--acid)}
.rb svg{width:46px;height:46px;pointer-events:none}
.rb.big svg{width:88px;height:88px}
.rb .tx{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;pointer-events:none}
.pf{position:absolute;left:50%;top:24%;width:30px;height:30px;pointer-events:none;animation:up .9s ease-out forwards}
.pf svg,.pf .tx{width:100%;height:100%;font-size:26px}
@keyframes up{0%{opacity:1;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-90px) scale(1.5)}}
.sent{margin-top:6px;font-size:14px;color:var(--dim)}
.sent b{color:var(--lime)}

.in{
  display:block;width:100%;-webkit-appearance:none;appearance:none;border-radius:0;outline:none;
  background:rgba(2,10,5,.75);border:2px solid var(--line);color:var(--bone);
  font-family:var(--body);font-weight:700;font-size:20px;padding:13px;
  transition:border-color .15s,box-shadow .15s;
}
.in::placeholder{color:#3F7655;font-weight:400}
.in:focus{border-color:var(--acid);box-shadow:0 0 0 3px rgba(244,255,26,.16),0 0 26px rgba(244,255,26,.16)}
.in+.in{margin-top:10px}
.go-wrap{margin-top:12px;filter:drop-shadow(0 0 16px rgba(244,255,26,.4))}
.go{
  display:block;width:100%;-webkit-appearance:none;appearance:none;border:0;border-radius:0;cursor:pointer;
  background:var(--acid);color:#061207;text-decoration:none;
  font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:40px;line-height:1;
  padding:15px 20px 13px;text-align:left;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  transition:transform .08s;
}
.go:active{transform:translate(2px,2px)}
.go.ghost{background:transparent;color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime);clip-path:none}
.go:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.status{margin-top:12px;min-height:22px;font-weight:700;font-size:15px;color:var(--dim)}
.status.err{color:var(--alarm);padding-left:10px;border-left:3px solid var(--alarm)}
@media (prefers-reduced-motion:reduce){
  .title span{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="floor"></div>

<main class="wrap">
  <h1 class="title"><span>Make</span><span>some</span><span>noise.</span></h1>

  <div class="now">
    <img id="nimg" alt="" hidden>
    <div>
      <div class="lab">On the big screen now</div>
      <div class="nname" id="nname">Waiting for the screen</div>
    </div>
  </div>

  <div class="step s1">
    <div class="sh"><span class="num">1</span><span class="sl">Hit it</span><span class="sn">tap as much as you want</span></div>
    <div class="rx" id="rx"></div>
    <p class="sent">You have sent <b id="sent">0</b></p>
  </div>

  <div class="step s2">
    <div class="sh"><span class="num">2</span><span class="sl">Sign the yearbook</span><span class="sn">shows on the screen</span></div>
    <input class="in" id="nm" type="text" maxlength="24" placeholder="Your name" autocomplete="given-name" autocapitalize="words">
    <input class="in" id="msg" type="text" maxlength="60" placeholder="Say something nice (or chaotic)" enterkeyhint="send">
    <div class="go-wrap"><button class="go" id="sign" type="button">Sign it</button></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="step s3">
    <a class="go ghost" href="upload.html">Add your own shot</a>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};
const db = getFirestore(initializeApp(firebaseConfig));

const NAME_KEY = "photowall_name";
const ICON = {
  heart: '<svg viewBox="0 0 24 24"><path fill="#FF4058" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><polygon fill="#F4FF1A" points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><polygon fill="#37FF76" points="13,2 4,14 11,14 10,22 20,9 13,9"/></svg>',
  lol: '<b class="tx" style="color:#F4FF1A">LOL</b>',
  wow: '<b class="tx" style="color:#37FF76">WOW</b>'
};
const KINDS = ["heart", "star", "bolt", "lol", "wow"];

const $ = function (s) { return document.querySelector(s); };
const rx = $("#rx"), sentEl = $("#sent"), nimg = $("#nimg"), nname = $("#nname");
const nmIn = $("#nm"), msgIn = $("#msg"), signBtn = $("#sign"), statusEl = $("#status");

let now = {}, sent = 0, pending = {}, flushT = null, lastSign = 0;
try { nmIn.value = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}

/* what is on the big screen right now */
function updateNow() {
  nname.textContent = now.name ? now.name : "Waiting for the screen";
  if (now.thumb) {
    if (nimg.getAttribute("src") !== now.thumb) nimg.src = now.thumb;
    nimg.hidden = false;
  } else nimg.hidden = true;
}
onSnapshot(doc(db, "state", "now"), function (s) { now = s.data() || {}; updateNow(); }, function (e) { console.warn(e); });

/* reactions: taps are batched into one write every ~1.2s */
function pop(k, b) {
  if (b.querySelectorAll(".pf").length > 8) return;
  const e = document.createElement("div");
  e.className = "pf"; e.innerHTML = ICON[k];
  e.style.setProperty("--dx", ((Math.random() * 60) - 30).toFixed(0) + "px");
  b.appendChild(e);
  setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 950);
}
function tap(k, b) {
  const id = now.id || "";
  const p = pending[id] || (pending[id] = {});
  p[k] = Math.min((p[k] || 0) + 1, 60);
  sent++; sentEl.textContent = sent;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  pop(k, b);
  if (!flushT) flushT = setTimeout(flush, 1200);
}
async function flush() {
  flushT = null;
  const ids = Object.keys(pending);
  for (let i = 0; i < ids.length; i++) {
    const c = pending[ids[i]]; delete pending[ids[i]];
    try { await addDoc(collection(db, "reactions"), { mediaId: ids[i], c: c, t: serverTimestamp() }); } catch (e) { console.warn(e); }
  }
}
KINDS.forEach(function (k, i) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "rb " + (i === 0 ? "big" : "sm");
  b.setAttribute("aria-label", k); b.innerHTML = ICON[k];
  b.addEventListener("pointerdown", function (e) { e.preventDefault(); tap(k, b); });
  b.addEventListener("click", function (e) { if (e.detail === 0) tap(k, b); });
  rx.appendChild(b);
});
document.addEventListener("visibilitychange", function () { if (document.hidden && flushT) { clearTimeout(flushT); flush(); } });

/* sign the yearbook */
function say(msg, err) { statusEl.textContent = msg; statusEl.className = err ? "status err" : "status"; }
async function sign() {
  const text = msgIn.value.trim().slice(0, 60);
  const name = nmIn.value.trim().slice(0, 24) || "A guest";
  if (!text) { say("Write something first.", true); msgIn.focus(); return; }
  if (Date.now() - lastSign < 6000) { say("Easy. One at a time.", true); return; }
  lastSign = Date.now();
  signBtn.disabled = true;
  try {
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
    await addDoc(collection(db, "comments"), { mediaId: now.id || "", name: name, text: text, t: serverTimestamp() });
    msgIn.value = "";
    say("Signed. Watch the screen.", false);
  } catch (e) {
    console.warn(e); lastSign = 0;
    say("Did not send. Check your signal and try again.", true);
  } finally { signBtn.disabled = false; }
}
signBtn.addEventListener("click", sign);
msgIn.addEventListener("keydown", function (e) { if (e.key === "Enter") sign(); });
</script>
</body>
</html>
