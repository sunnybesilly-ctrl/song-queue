<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drop Your Shot × Jukebox · Philips TV</title>
<style>
:root{color-scheme:dark;--gold:#ffd700;--mint:#b9f4c8;--shell:#091a10;--radius:1.25vw}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{color:#fafbf5;background:radial-gradient(ellipse at 24% 45%,#183924,#07160d 65%,#030906);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{position:absolute;inset:6% 6%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:1vw}
iframe,aside{border-radius:var(--radius);min-width:0;box-shadow:0 .5vw 1.4vw #0005}
iframe{display:block;width:100%;height:100%;border:2px solid #77a384;background:#050906}
aside{min-height:0;display:flex;flex-direction:column;padding:1.05vw .75vw .75vw;background:linear-gradient(155deg,#193925,var(--shell) 42%);border:2px solid #8bb796;overflow:hidden}
h1,h2{padding-inline:.2vw}
h1{margin:0;font-size:3vw;line-height:1;font-weight:800;letter-spacing:-.045em;color:#ffe66b}
h2{font-size:1.55vw;font-weight:600;margin:.35em 0 .65em;color:#ddeddf}
#queueWindow{position:relative;flex:1;min-height:0;overflow:hidden}
#cards{font-size:1.7vw}
.queue-set{display:grid;gap:1.15vh;padding-bottom:1.15vh}
article{display:flow-root;padding:.63vw .6vw .7vw;border:clamp(2px,.18vw,4px) solid #a2d9af;border-radius:.85vw;background:linear-gradient(145deg,#193827,#102319);overflow-wrap:anywhere}
article.new{border-color:var(--gold);background:#253820}
b{display:inline-block;padding:.08em .32em;border-radius:.32em;background:var(--gold);color:#102016;font-size:2.65vw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.12}
.queue-thumb{float:right;width:48%;aspect-ratio:16/9;object-fit:cover;border-radius:.46vw}
h3,p,small{display:block;margin:0;line-height:1.13;letter-spacing:-.018em}
h3{clear:both;padding-top:.43vw;font-size:2vw;font-weight:700}
p{padding-top:.24vw;font-size:1.55vw;color:#ecf6eb}
small{margin-top:.45vw;padding-top:.38vw;border-top:1px solid #83ac8c;font-size:1.5vw;color:var(--mint)}
#announcement{position:absolute;inset:0;background:var(--shell);overflow:auto}
#announcement[hidden]{display:none}
</style></head><body><main><iframe title="Drop Your Shot photo and video wall" src="./display.html?screen=philips-tv&amp;cinematic=1&amp;hybrid=jukebox" allow="autoplay; fullscreen" allowfullscreen></iframe><aside><h1>JUKEBOX</h1><h2>Song requests</h2><div id="queueWindow"><div id="cards">Loading queue…</div><div id="announcement" hidden></div></div></aside></main><script>const SONG_QUEUE_URL   = 'https://script.google.com/macros/s/AKfycbwOl2qF3bAl5yWNolDvYlN0Thgp93jgJAQuUB7lphpw5xEqY5tdHMFjxR4VskzsWXnTvA/exec';
function getSongName(song) {
      const keys = [
        "WHAT’S YOUR NAME?",   // curly apostrophe — CONFIRMED from sheet
        "WHAT'S YOUR NAME?",          // straight apostrophe fallback
        "What’s your name?",
        "What's your name?",
        "Name", "name", "NAME",
        "YOUR NAME", "Your Name",
        "Requester", "requester",
        "Guest Name", "guest name"
      ];
      for (const k of keys) {
        const v = (song[k] || '').toString().trim();
        if (!v || v.length < 2) continue;
        if (/^\d{4}-\d{2}-\d{2}T/.test(v)) continue; // skip timestamps
        if (/^\d+$/.test(v)) continue;                      // skip pure numbers
        return v;
      }
      return '';
    }

    // Artist name — HARDCODED exact keys confirmed from Google Sheet console log
    function getArtist(song) {
      const keys = [
        "WHO’S THE ARTIST?",  // curly apostrophe — CONFIRMED from sheet
        "WHO'S THE ARTIST?",          // straight apostrophe fallback
        "Who’s the artist?",
        "Who's the artist?",
        "Artist", "artist", "ARTIST", "Artist Name", "Band"
      ];
      for (const k of keys) {
        const v = (song[k] || '').toString().trim();
        if (v && !/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
      }
      return '';
    }

    // Song title — hardcoded exact keys from sheet
    function getSongTitle(song) {
      const exactKeys = [
        "SONG TITLE?",  // confirmed from sheet
        "Song Title?", "SONG TITLE", "Song Title",
        "Song", "song", "SONG", "Track", "track"
      ];
      for (const k of exactKeys) {
        const v = (song[k] || '').toString().trim();
        if (v && !/^\d{4}-\d{2}-\d{2}T/.test(v)) return v;
      }
      return '';
    }

    function getTimestamp(song) {
      return song["Timestamp"] || song["timestamp"] || song["TIMESTAMP"] || "";
    }
function getVideoId(song) {
      const exactKeys = [
        "Video ID",   // confirmed from sheet
        "video id", "videoId", "VIDEO ID", "VideoID",
        "video_id", "Youtube ID", "YouTube ID"
      ];
      for (const k of exactKeys) {
        const v = (song[k] || '').toString().trim();
        // A valid YouTube video ID is exactly 11 chars: letters, digits, - and _
        if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
      }
      const videoLink = /^https?:\/\/(?:(?:www\.)?youtu\.be\/|(?:(?:www|music|m)\.)?youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})(?:[?&#/]|$)/i;
      for (const value of Object.values(song)) {
        if (typeof value !== "string") continue;
        const match = videoLink.exec(value.trim());
        if (match) return match[1];
      }
      return '';
    }

    
function todaysQueue(songs) {
  const today = new Date().toDateString();
  const sorted = songs.filter(song => (getArtist(song) || getSongTitle(song)) && (!getTimestamp(song) || new Date(getTimestamp(song)).toDateString() === today))
    .sort((a,b)=>new Date(getTimestamp(a)||0)-new Date(getTimestamp(b)||0));
  const normalized = value => String(value || "").toLowerCase().replace(/[^a-z0-9\u00c0-\u024f]+/g, "");
        const unique = [], recent = new Map();
        for (const song of sorted) {
          const id = String(song["Request ID"] || song.requestId || "").trim();
          const key = id ? "id:" + id : "legacy:" + normalized(getSongName(song)) + "|" + normalized(getArtist(song)) + "|" + normalized(getSongTitle(song));
          const when = new Date(getTimestamp(song)).getTime();
          const previous = recent.get(key);
          if (previous && (id || (Number.isFinite(when) && Number.isFinite(previous.when) && Math.abs(when - previous.when) <= 10000))) {
            const original = unique[previous.index];
            Object.keys(song).forEach(field => {
              if (!original[field] && song[field]) original[field] = song[field];
            });
          } else {
            recent.set(key, {index: unique.length, when});
            unique.push({...song});
          }
        }
        
  return unique.map((song,index)=>({number:index+1,videoId:getVideoId(song),title:getSongTitle(song),artist:getArtist(song),name:getSongName(song),
    key:song["Request ID"] || song.requestId || JSON.stringify([getTimestamp(song),getSongTitle(song),getArtist(song),getSongName(song)])}));
}
const cards=document.querySelector("#cards");
const heading=document.querySelector("h2");
const viewport=document.querySelector("#queueWindow");
const announcement=document.querySelector("#announcement");
const scrollPixelsPerMs = 0.07;
let queue=[], known=null, signature="", animation=null, cycle=0;
const alerts=[];
function makeCard(song,isNew=false){
    const card=document.createElement("article");
    if(isNew) card.className="new";
    if(song.videoId){
      const thumb=document.createElement("img");
      thumb.className="queue-thumb";
      thumb.alt="";
      thumb.decoding="async";
      thumb.onerror=()=>thumb.remove();
      thumb.src="https://i.ytimg.com/vi/"+song.videoId+"/mqdefault.jpg";
      card.append(thumb);
    }
    for(const [tag,value] of [["b","#"+song.number],["h3",song.title||song.artist],["p",song.title?song.artist:""],["small",song.name && "Requested by "+song.name]]){
      if(!value)continue;
      const el=document.createElement(tag);el.textContent=value;card.append(el);
    }
  return card;
}
function draw(){
  const offset=animation ? (Number(animation.currentTime)||0)*scrollPixelsPerMs : 0;
  if(animation) animation.cancel();
  animation=null;
  const group=document.createElement("div");
  group.className="queue-set";
  for(const song of queue) group.append(makeCard(song));
  cards.replaceChildren(group);
  if(!queue.length){cards.textContent="No requests yet";return;}
  cycle=group.getBoundingClientRect().height;
  if(cycle-parseFloat(getComputedStyle(group).paddingBottom)<=viewport.clientHeight)return;
  const twin=group.cloneNode(true);
  twin.setAttribute("aria-hidden","true");
  cards.append(twin);
  animation=cards.animate([{transform:"translateY(0)"},{transform:"translateY(-"+cycle+"px)"}],{duration:cycle/scrollPixelsPerMs,iterations:Infinity,easing:"linear"});
  animation.currentTime=(offset%cycle)/scrollPixelsPerMs;
  if(!announcement.hidden)animation.pause();
}
function announce(){
  if(!announcement.hidden || !alerts.length)return;
  announcement.replaceChildren(makeCard(alerts.shift(),true));
  heading.textContent="New song request";
  announcement.hidden=false;
  if(animation)animation.pause();
  setTimeout(()=>{
    announcement.hidden=true;
    heading.textContent="Song requests";
    if(animation)animation.play();
    announce();
  },6000);
}
window.addEventListener("resize",()=>{if(known)draw();});
async function refresh(){
  try{
    const response=await fetch(SONG_QUEUE_URL,{cache:"no-store"});
    if(!response.ok)throw Error(response.status);
    const rows=await response.json();
    if(!Array.isArray(rows))throw Error("Invalid song feed");
    queue=todaysQueue(rows);
    if(known)alerts.push(...queue.filter(song=>!known.has(song.key)));
    known=new Set(queue.map(song=>song.key));
    const next=JSON.stringify(queue);
    if(next!==signature){signature=next;draw();}
    announce();
  }catch(error){if(!known)cards.textContent="Reconnecting to queue…";}
  finally{setTimeout(refresh,10000);}
}
refresh();</script></body></html>
