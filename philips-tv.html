<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020a05">
<title>Sunny Photo Wall — Philips TV / Roku</title>
<style>
  :root{color-scheme:dark;--edge-x:8%;--edge-y:7.5%}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a}
  body{font:14px system-ui,sans-serif}
  /* Keep the Philips overscan inset around the content. */
  .screen,.tv-frame{position:absolute;inset:var(--edge-y) var(--edge-x)}
  .screen{width:calc(100% - 2 * var(--edge-x));height:calc(100% - 2 * var(--edge-y));border:0;background:#101113}
  .tv-frame{outline:1px solid #44453a;pointer-events:none;z-index:2}
  .fallback{position:absolute;bottom:1.35%;left:50%;transform:translateX(-50%);white-space:nowrap}
  .fallback a{color:#bec0b3;font-size:clamp(11px,1.6vh,18px);text-decoration:none}
  .fallback a:focus-visible{outline:2px solid #f4ff1a;outline-offset:3px}
  @media(max-width:700px) and (orientation:portrait){
    :root{--edge-x:0%;--edge-y:0%}
    .tv-frame,.fallback{display:none}
  }
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Wall">
<link rel="apple-touch-icon" sizes="180x180" href="icons/photo-tv.png?v=20261111-links2">
<link rel="icon" type="image/png" href="icons/photo-tv.png?v=20261111-links2">
</head>
<body>
<div class="tv-frame" aria-hidden="true"></div>
<iframe class="screen" title="Sunny DJ photo wall television display" src="./display.html?screen=philips-tv&amp;cinematic=1&amp;layout=20261119-wall-large-footer" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div class="fallback"><a href="./display.html?v=20261119-wall-large-footer">Full-width display</a></div>
</body>
</html>
