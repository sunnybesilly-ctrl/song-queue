<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Album Display</title>
<style>
body {
margin: 0;
padding: 0;
background: #020a05;
color: #ccff00;
font-family: Arial, sans-serif;
overflow: hidden;
}
#media-container {
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
display: none;
}
#media-container img, #media-container video {
width: 100%;
height: 100%;
object-fit: contain;
}
#empty-screen {
width: 100vw;
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
}
h1 { font-size: 4vw; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 20px #39ff14; }
.qr-box { background: white; padding: 20px; border-radius: 20px; border: 5px solid #ccff00; }
.qr-box img { width: 300px; height: 300px; }
</style>
</head>
<body>

<!-- This shows when there are no photos yet -->
<div id="empty-screen">
<h1>Scan to add to the album!</h1>
<div class="qr-box">
<!-- This generates a QR code pointing to your upload page -->
<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://sunnybesilly-ctrl.github.io/song-queue/upload.html" alt="QR Code">
</div>
</div>

<!-- This shows the photos and videos -->
<div id="media-container">
<img id="display-img" src="" style="display:none;">
<video id="display-video" style="display:none;" muted playsinline></video>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ⚠️ REPLACE THIS WITH YOUR REAL FIREBASE CONFIG ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let mediaList = [];
let currentIndex = 0;
let isPlaying = false;
let imageTimeout;

const emptyScreen = document.getElementById('empty-screen');
const mediaContainer = document.getElementById('media-container');
const imgEl = document.getElementById('display-img');
const vidEl = document.getElementById('display-video');

// Listen for real-time updates
const q = query(collection(db, "media_queue"), orderBy("timestamp", "asc"));
onSnapshot(q, (snapshot) => {
mediaList = [];
snapshot.forEach((doc) => {
mediaList.push(doc.data());
});

// If it was empty and now we have photos, start the show!
if (!isPlaying && mediaList.length > 0) {
isPlaying = true;
emptyScreen.style.display = 'none';
mediaContainer.style.display = 'flex';
playNext();
}
});

function playNext() {
// If no media, show QR code
if (mediaList.length === 0) {
isPlaying = false;
mediaContainer.style.display = 'none';
emptyScreen.style.display = 'flex';
return;
}

// Loop back to the start
if (currentIndex >= mediaList.length) {
currentIndex = 0;
}

const currentMedia = mediaList[currentIndex];
clearTimeout(imageTimeout);

if (currentMedia.type === 'video') {
imgEl.style.display = 'none';
vidEl.style.display = 'block';
vidEl.src = currentMedia.url;
vidEl.play().catch(e => console.log("Autoplay blocked", e));

// Move to next when video ends
vidEl.onended = () => {
currentIndex++;
playNext();
};
} else {
vidEl.style.display = 'none';
imgEl.style.display = 'block';
imgEl.src = currentMedia.url;

// Show image for 10 seconds
imageTimeout = setTimeout(() => {
currentIndex++;
playNext();
}, 10000);
}
}
</script>
</body>
</html>
