<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop your shot - Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --base:#04140A;--deep:#020A05;--bog:#0B2615;--line:#1F6B3A;
  --acid:#F4FF1A;--lime:#37FF76;--bone:#E9FFEA;--dim:#7FB391;--alarm:#FF4058;
  --bar:16vh;
  --dv:1vh;
  --chip:7.4vh;
  --display:"Big Shoulders Display",Impact,sans-serif;
  --body:"Familjen Grotesk",sans-serif;
  --ink:"Permanent Marker","Comic Sans MS",cursive;
}
@supports (height:1dvh){:root{--dv:1dvh}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);cursor:none}
body{font-family:var(--body);color:var(--bone)}

#stage{position:absolute;left:0;top:0;right:0;bottom:var(--bar);z-index:1;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 10%,#0e2a17 0%,transparent 60%),radial-gradient(90% 70% at 10% 100%,#2a0a0a 0%,transparent 55%),#050a07}
.w{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;z-index:1;overflow:hidden}
.w.top{z-index:3}
.w.old{opacity:1;z-index:2}
.mi{display:block;width:100%;height:100%;object-fit:contain}
.mi.kb{animation:kb 8s linear forwards}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.07)}}

@keyframes tZoom{0%{opacity:0;transform:scale(1.4)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes tWhipL{0%{opacity:1;transform:translateX(105%)}70%{opacity:1;transform:translateX(-2%)}100%{opacity:1;transform:translateX(0)}}
@keyframes tWhipR{0%{opacity:1;transform:translateX(-105%)}70%{opacity:1;transform:translateX(2%)}100%{opacity:1;transform:translateX(0)}}
@keyframes tDrop{0%{opacity:1;transform:translateY(-105%)}60%{opacity:1;transform:translateY(3%)}80%{opacity:1;transform:translateY(-1.5%)}100%{opacity:1;transform:translateY(0)}}
@keyframes tSpin{0%{opacity:0;transform:rotate(-12deg) scale(.55)}60%{opacity:1}100%{opacity:1;transform:rotate(0) scale(1)}}
@keyframes tPop{0%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes tCut{0%,100%{opacity:1}}
@keyframes tFade{0%{opacity:0}100%{opacity:1}}
.in-zoom{animation:tZoom .62s cubic-bezier(.2,.8,.2,1) forwards}
.in-whipl{animation:tWhipL .6s cubic-bezier(.2,.9,.25,1) forwards}
.in-whipr{animation:tWhipR .6s cubic-bezier(.2,.9,.25,1) forwards}
.in-drop{animation:tDrop .75s ease-out forwards}
.in-spin{animation:tSpin .72s cubic-bezier(.2,1.2,.4,1) forwards}
.in-pop{animation:tPop .56s ease-out forwards}
.in-cut{animation:tCut .45s linear forwards}
.in-fade{animation:tFade .5s linear forwards}

#flash{position:absolute;left:0;top:0;right:0;bottom:var(--bar);z-index:5;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.5}100%{opacity:0}}

#qrcard{position:absolute;left:0;top:0;right:0;bottom:var(--bar);z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;
  background:radial-gradient(120% 90% at 85% 10%,#0e2a17 0%,transparent 60%),radial-gradient(90% 70% at 10% 100%,#2a0a0a 0%,transparent 55%),#050a07;
  opacity:0;visibility:hidden;transition:opacity .5s linear,visibility 0s linear .5s}
#qrcard.on{opacity:1;visibility:visible;transition:opacity .5s linear}
.qt .a{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:23vh;line-height:.8;color:var(--acid);text-shadow:0 0 2vh rgba(244,255,26,.55)}
.qt .a2{margin-left:7%}
.qt .a3{margin-left:2%}
.qt .qs{margin-top:3vh;padding-left:1.2vw;border-left:.6vh solid var(--lime);font-weight:700;font-size:3.4vh;color:var(--dim);max-width:30vw}
#qrcard.on .a{animation:tube 1.3s steps(1,end) both}
#qrcard.on .a2{animation-delay:.35s}
#qrcard.on .a3{animation-delay:.7s}
@keyframes tube{0%{opacity:.14}14%{opacity:1}22%{opacity:.2}30%{opacity:1}38%{opacity:.3}46%,100%{opacity:1}}
.qq{display:flex;align-items:flex-start}
.qb{margin-left:3vw}
.qb.b2{margin-top:8vh}
.qb .tile{width:34vh;height:34vh;box-shadow:0 0 0 .7vh var(--lime),0 0 5vh rgba(55,255,118,.45)}
.qb .ql{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:4.6vh;line-height:1;color:var(--acid);margin-top:2vh}
#qrcard.on .qb .tile{animation:pulse2 2.4s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.035)}}
.tile svg,.tile img{display:block;width:100%;height:100%}

#fx{position:absolute;left:0;top:0;right:0;bottom:var(--bar);z-index:7;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:0;animation:rise 3s ease-out forwards;line-height:1}
.fl svg{display:block;width:100%;height:100%}
.fl .tx{display:block;font-family:var(--display);font-weight:900;font-size:1em;line-height:1;text-shadow:0 0 1vh #000}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}12%{opacity:1;transform:translateY(-6vh) scale(1)}100%{opacity:0;transform:translateY(-78vh) translateX(var(--sx,0)) scale(1.1)}}

#bar{position:absolute;left:0;right:0;bottom:0;height:var(--bar);z-index:8;display:flex;align-items:stretch;
  background:linear-gradient(90deg,#020A05,#07200F 55%,#0B2615);border-top:.6vh solid var(--acid)}
.who{flex:0 0 26vw;position:relative;padding:0 1.6vw;display:flex;flex-direction:column;justify-content:center;border-right:2px solid var(--line);overflow:hidden}
.lab{font-weight:700;font-size:1.8vh;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.nm{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:5.8vh;line-height:.92;color:var(--acid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.slam{animation:slam .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slam{0%{opacity:0;transform:translateX(-4vw) scale(1.25)}100%{opacity:1;transform:none}}
.hr{display:flex;align-items:center;margin-top:.8vh;font-weight:700;font-size:2.8vh}
.hr svg{width:3.2vh;height:3.2vh;margin-right:1vh;display:block}
.hr b{display:inline-block}
.hr b.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.new{position:absolute;right:1vw;top:1vh;display:none;background:var(--alarm);color:#fff;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.6vh;padding:.3vh 1vh;transform:rotate(4deg);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.45}}
.say{flex:1;min-width:0;display:flex;align-items:center;padding:0 2vw;overflow:hidden}
.hint{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:3.8vh;line-height:.98;color:var(--lime)}
.cmt{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.cmt.pop{animation:cin .45s cubic-bezier(.2,.9,.2,1) both}
@keyframes cin{0%{opacity:0;transform:translateY(5vh)}100%{opacity:1;transform:none}}
.cmt b{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.8vh;letter-spacing:.08em;color:var(--acid)}
.cmt span{font-weight:700;font-size:3.6vh;line-height:1.05;color:var(--bone);max-height:7.6vh;overflow:hidden}
.qrs{flex:0 0 auto;display:flex;align-items:center;padding:0 1.2vw}
.q{margin-left:1.2vw;text-align:center}
.q .tile{width:9.6vh;height:9.6vh}
.q i{display:block;font-style:normal;font-weight:700;font-size:1.5vh;letter-spacing:.14em;color:var(--lime);margin-top:.5vh;white-space:nowrap}

#toast{position:absolute;top:2vh;right:2vw;z-index:20;background:var(--acid);color:#061207;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:3.4vh;padding:.6vh 1.6vh;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

#yb{position:absolute;left:0;top:0;right:0;bottom:0;z-index:9;display:none;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 10%,#0e2a17 0%,transparent 60%),radial-gradient(90% 70% at 10% 100%,#2a0a0a 0%,transparent 55%),#050a07}
#yb.on{display:block}
.pg{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;padding:0 6vw;animation:pgIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pgIn{0%{opacity:0;transform:scale(1.08)}100%{opacity:1;transform:none}}
.pg.sig,.pg.cls{display:block}
.pg.cover{justify-content:flex-start}
.cover .k,.cap .k{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:4.2vh;letter-spacing:.3em;color:var(--lime)}
.cover .t{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34vh;line-height:.8;color:transparent;-webkit-text-stroke:.6vh var(--acid);transform:rotate(-3deg);margin:2vh 0 3vh -.5vw}
.cover .n{font-family:var(--ink);font-size:5vh;color:var(--bone)}
.snap{flex:0 0 52vw;height:78vh;background:#F3EBD5;padding:2.2vh 2.2vh 7.5vh;position:relative;transform:rotate(-2.2deg)}
.snap .mi{background:#0a1a10}
.snap em{position:absolute;left:2.4vh;bottom:1.6vh;font-family:var(--ink);font-style:normal;font-size:3.6vh;color:#1a2b1d}
.cap{flex:1;min-width:0;margin-left:5vw}
.cap .t{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:14vh;line-height:.84;color:var(--acid);margin:1.4vh 0 2vh -.3vw;transform:rotate(-3deg);transform-origin:0 100%}
.cap .n{font-family:var(--ink);font-size:6vh;color:var(--bone)}
.cap .s{margin-top:1.6vh;font-weight:700;font-size:3vh;color:var(--dim)}
.t2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:11vh;line-height:.85;color:var(--acid);padding-top:3vh}
.note{position:absolute;width:27vw;opacity:0;animation:noteIn .5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes noteIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1}}
.note span{display:block;font-family:var(--ink);font-size:4vh;line-height:1.1}
.note em{display:block;margin-top:.8vh;font-style:normal;font-weight:700;font-size:2.4vh;color:var(--dim)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:1vh 0 0}
.cell{width:11.8vw;height:11.8vw;margin:0 .8vw 1.2vh;opacity:0;animation:cellIn .5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes cellIn{0%{opacity:0;transform:scale(.3) rotate(0)}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.cell img{display:block;width:100%;height:100%;object-fit:cover}
.foot{position:absolute;left:6vw;bottom:3vh;font-family:var(--ink);font-size:4vh;color:var(--bone)}

#vbadge{position:absolute;left:2vw;bottom:calc(var(--bar) + 1.2vh);z-index:6;max-width:96vw;padding:.4vh 1.4vh;background:var(--alarm);color:#fff;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.8vh;line-height:1.05;display:none}

#brand{position:absolute;left:1.4vw;top:1.2vh;z-index:25;display:flex;align-items:center;font-family:var(--ink);font-size:2.3vh;line-height:1;color:var(--bone);opacity:.82;text-shadow:0 0 .8vh #000,0 0 .3vh #000;pointer-events:none;max-width:92vw}
#brand svg{width:3vh;height:3vh;margin-right:.8vh;flex:none}

#rx{position:absolute;left:0;top:0;right:0;bottom:var(--bar);z-index:6;pointer-events:none;overflow:hidden}
.rbox{position:absolute;display:flex;flex-direction:row-reverse;align-items:flex-start}
.rail{display:flex;flex-direction:column;align-items:center;width:var(--chip)}
.feed{display:flex;flex-direction:column;align-items:flex-end;margin-right:calc(var(--chip)*.35);padding-top:calc(var(--chip)*.2)}
.rc{position:relative;isolation:isolate;width:var(--chip);height:var(--chip);margin:calc(var(--chip)*.09) 0;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3b2a00,#140d00);box-shadow:0 0 0 calc(var(--chip)*.06) #FFC21A,0 0 calc(var(--chip)*.5) rgba(255,194,26,.7);animation:rcIn .5s cubic-bezier(.2,1.5,.4,1) both}
.rc.off{display:none}
.rc::before{content:"";position:absolute;left:-20%;top:-20%;right:-20%;bottom:-20%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(#FFC21A 0 6deg,transparent 6deg 22.5deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rcIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}100%{opacity:1;transform:none}}
.ic{width:62%;height:62%}
.ic svg{display:block;width:100%;height:100%}
.rn{position:absolute;right:-12%;bottom:-10%;min-width:calc(var(--chip)*.5);height:calc(var(--chip)*.5);padding:0 calc(var(--chip)*.1);display:flex;align-items:center;justify-content:center;border-radius:calc(var(--chip)*.25);background:#FFC21A;color:#1b1300;border:calc(var(--chip)*.04) solid #140d00;font-family:var(--display);font-weight:900;font-size:calc(var(--chip)*.36);line-height:1}
.rn.bump{animation:bump .35s ease-out}
.bub{display:flex;align-items:center;margin-top:calc(var(--chip)*.1);padding:calc(var(--chip)*.06) calc(var(--chip)*.22) calc(var(--chip)*.06) calc(var(--chip)*.06);border-radius:calc(var(--chip)*.4);background:rgba(20,13,0,.88);border:3px solid #FFC21A;color:#FFF3A0;font-weight:700;font-size:calc(var(--chip)*.32);line-height:1;animation:bubIn .35s cubic-bezier(.2,1.3,.4,1) both,bubOut .4s ease-in 2.6s forwards}
@keyframes bubIn{0%{opacity:0;transform:translateX(30%) scale(.7)}100%{opacity:1;transform:none}}
@keyframes bubOut{to{opacity:0;transform:translateY(-30%)}}
.av{width:calc(var(--chip)*.62);height:calc(var(--chip)*.62);flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-right:calc(var(--chip)*.14);font-family:var(--display);font-weight:900;font-size:calc(var(--chip)*.34);color:#1b1300}
.bn{max-width:calc(var(--chip)*2.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi{display:block;margin-left:calc(var(--chip)*.14)}
.bi svg{display:block;width:calc(var(--chip)*.46);height:calc(var(--chip)*.46)}
.bx{margin-left:calc(var(--chip)*.1);color:#FFC21A;font-family:var(--display);font-weight:900}
.srail{position:absolute;right:calc(var(--chip)*-.5);top:5%}
.wr{display:flex;align-items:center;margin-top:1.6vh}
.wr .av{margin-right:0;margin-left:calc(var(--chip)*-.14);border:3px solid #140d00}
.wr .av:first-child{margin-left:0}
.wr span{margin-left:1.2vh;font-weight:700;color:var(--dim);font-size:2.6vh}
.lite .rc::before{animation:none}

/* yearbook signatures */
.pg.sig { display:flex !important; flex-direction:column; justify-content:center; padding:5vh 8vw; }
.sig-head { display:flex; align-items:flex-end; justify-content:space-between; gap:2vw; width:100%; border-bottom:2px solid var(--line); padding-bottom:1.5vh; }
.sig-head .t2 { padding:0; }
.sig-page-no { color:var(--dim);font-weight:700;font-size:2.4vh;letter-spacing:.12em;white-space:nowrap; }
.sig-sub { width:100%;margin-top:1.5vh;color:var(--dim);font-size:2.8vh; }
.sig-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:2vh 2vw; padding-top:3vh; width:100%; }
.sig-card { display:flex;flex-direction:column;justify-content:space-between;min-height:18vh;background:rgba(11,38,21,.72);border:1px solid rgba(55,255,118,.55);border-left:5px solid var(--lime);padding:2.2vh 2vw;border-radius:.8vh;opacity:0;animation:cellIn .6s cubic-bezier(.2,1.3,.4,1) forwards; }
.sig-text { font-family:var(--body);font-weight:700;font-size:3.3vh;line-height:1.18;color:var(--bone);margin-bottom:1.4vh;word-break:break-word; }
.sig-name { font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.2vh;color:var(--acid);letter-spacing:.1em; }

.lite .mi.kb,.lite .new,.lite #qrcard.on .qb .tile,.lite #qrcard.on .a{animation:none}
.lite .cell,.lite .note{animation:none;opacity:1}

@media (orientation:portrait){
  :root{--bar:calc(var(--dv)*26);--chip:11.5vw}
  #brand{left:3vw;top:calc(var(--dv)*.8);font-size:3.2vw}
  #brand svg{width:4vw;height:4vw;margin-right:1.2vw}
  .wr{margin-top:calc(var(--dv)*1)}
  .wr span{font-size:4vw}

  #bar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .who{grid-column:1;grid-row:1;flex:none;min-width:0;padding:calc(var(--dv)*1.2) 4vw;border-right:0}
  .lab{font-size:3vw;letter-spacing:.16em}
  .nm{font-size:6.6vw;line-height:.95;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-overflow:clip}
  .hr{margin-top:calc(var(--dv)*.5);font-size:5vw}
  .hr svg{width:5.4vw;height:5.4vw;margin-right:2vw}
  .new{font-size:3.2vw;padding:.2vh 1.6vw;right:2vw;top:calc(var(--dv)*1)}
  .qrs{grid-column:2;grid-row:1;align-self:start;padding:calc(var(--dv)*1.2) 3vw 0 0}
  .q{margin-left:2vw;width:18vw}
  .q .tile{width:16vw;height:16vw;margin:0 auto}
  .q i{font-size:2.3vw;letter-spacing:.06em;line-height:1.15;white-space:normal}
  .say{grid-column:1/-1;grid-row:2;padding:0 4vw;border-top:2px solid var(--line)}
  .hint{font-size:5.2vw;line-height:1.02}
  .cmt b{font-size:3.6vw}
  .cmt span{font-size:4.5vw;line-height:1.1;max-height:none;overflow-wrap:anywhere}

  #qrcard{flex-direction:column;justify-content:center;align-items:stretch;padding:0 7vw}
  .qt .a{font-size:min(30vw,calc(var(--dv)*12.5))}
  .qt .qs{margin-top:calc(var(--dv)*2.2);padding-left:3vw;font-size:4.2vw;max-width:none}
  .qq{margin-top:calc(var(--dv)*3);justify-content:center}
  .qb{margin-left:0;text-align:center}
  .qb+.qb{margin-left:6vw}
  .qb.b2{margin-top:0}
  .qb .tile{width:min(38vw,calc(var(--dv)*17));height:min(38vw,calc(var(--dv)*17))}
  .qb .ql{font-size:4.8vw;margin-top:calc(var(--dv)*1.2)}

  #toast{top:calc(var(--dv)*1.5);right:3vw;font-size:6vw;padding:.4vh 3vw;max-width:94vw}
  #vbadge{font-size:4.6vw;padding:.4vh 2.4vw}

  .pg{flex-direction:column;justify-content:center;align-items:stretch;padding:calc(var(--dv)*3) 6vw}
  .pg.cover{align-items:flex-start}
  .cover .k,.cap .k{font-size:3.4vw;letter-spacing:.22em}
  .cover .t{font-size:min(21vw,calc(var(--dv)*15));-webkit-text-stroke-width:2px;margin:calc(var(--dv)*2) 0 calc(var(--dv)*2.5) -1vw}
  .cover .n{font-size:5.4vw}
  .snap{flex:0 0 auto;width:100%;height:calc(var(--dv)*42);padding:3vw 3vw 12vw}
  .snap em{left:3.6vw;bottom:3vw;font-size:5.4vw}
  .cap{flex:0 0 auto;margin:calc(var(--dv)*3) 0 0}
  .cap .t{font-size:min(15vw,calc(var(--dv)*8));margin:calc(var(--dv)*1) 0 calc(var(--dv)*1.2)}
  .cap .n{font-size:7vw}
  .cap .s{font-size:4.4vw}
  .t2{font-size:min(14vw,calc(var(--dv)*8));padding-top:0;grid-column:1/-1}
  
  .pg.sig{display:flex !important; flex-direction:column; justify-content:center;}
  .sig-grid{grid-template-columns:1fr;gap:1.2vh;padding-top:1vh;}
  .sig-card{padding:1.5vh 4vw;}
  .sig-text{font-size:4vw;}
  .sig-name{font-size:3.2vw;}

  .pg.cls{display:flex}
  .grid{flex:0 0 auto}
  .cell{width:19vw;height:19vw;margin:0 1.2vw calc(var(--dv)*1.2)}
  .foot{left:6vw;right:6vw;bottom:calc(var(--dv)*3);font-size:5.4vw}
}
</style>

  hint.textContent = "Media queue: " + (e.code || e.message || "Unknown error");
});

let rInit = false;
onSnapshot(collection(db, "reactions"), function (s) {
  rebuildRx(s.docs.filter(d => !!currentEventId && d.data().eventId === currentEventId));
  if (rInit) s.docChanges().forEach(function (c) {
    if (c.type !== "added") return;
    const d = c.doc.data(); if (!d.c || !currentEventId || d.eventId !== currentEventId) return;
    const id = d.mediaId || (curItem && curItem.id) || "";
    Object.keys(ICON).forEach(function (k) {
      const n = Math.min(Math.max(+d.c[k] || 0, 0), 60);
      if (!n) return;
      if (id && curItem && curItem.id === id && mode === "loop" && (views[id] || 0) > 2) {
        burst(k, n);
        liveRx({ w: who(d), k: k, n: n }, id);
      }
    });
  });
  rInit = true;
  if (curItem && mode === "loop") setHearts(curItem.id, false);
}, function (e) { console.warn(e); });

let cInit = false;
onSnapshot(query(collection(db, "comments"), orderBy("t", "desc"), limit(10)), function (s) {
  if (!cInit) { cInit = true; return; }
  s.docChanges().forEach(function (c) {
    if (c.type !== "added") return;
    const d = c.doc.data(); if (!d.text || !currentEventId || d.eventId !== currentEventId) return;
    pushComment({ name: String(d.name || "A guest").slice(0, 24), text: String(d.text).slice(0, 70) });
  });
}, function (e) { console.warn(e); });
}
const loginCover=document.createElement("div");
loginCover.id="projectorLogin";
loginCover.style.cssText="position:fixed;inset:0;z-index:2147483647;background:#06140b;color:#eeff12;display:flex;align-items:center;justify-content:center;font:18px system-ui;padding:20px";
loginCover.innerHTML='<form id="projectorLoginForm" style="background:#0e2917;border:1px solid #417a4d;padding:24px;max-width:420px;width:100%;border-radius:16px"><h2 style="margin-top:0">Projector sign-in</h2><p style="color:#b5cfb8">Sign in once with your verified DJ admin account. This keeps the private gallery media off public Firestore reads.</p><input id="projectorEmail" type="email" autocomplete="username" placeholder="Admin email" required style="width:100%;padding:12px;margin-bottom:10px"><input id="projectorPassword" type="password" autocomplete="current-password" placeholder="Password" required style="width:100%;padding:12px;margin-bottom:10px"><button style="width:100%;padding:12px;background:#efff12;color:#06140b;border:0;border-radius:8px;font-weight:bold">Start display</button><p id="projectorError" style="color:#ff8792"></p></form>';
document.body.appendChild(loginCover);
document.getElementById("projectorLoginForm").onsubmit=async e=>{
 e.preventDefault();
 document.getElementById("projectorError").textContent="Signing in…";
 try{await signInWithEmailAndPassword(displayAuth,document.getElementById("projectorEmail").value.trim(),document.getElementById("projectorPassword").value);}
 catch(err){document.getElementById("projectorError").textContent=err.message;}
};
let displayStarted=false;
onAuthStateChanged(displayAuth,async user=>{
 if(!user){loginCover.style.display="flex";return}
 try{await user.reload();await user.getIdToken(true);}catch(_){}
 if(user.email!=="sunnybesilly@gmail.com"||!user.emailVerified){
  loginCover.style.display="flex";
  document.getElementById("projectorError").textContent="This projector requires the verified DJ admin account.";
  return;
 }
 loginCover.style.display="none";
 if(!displayStarted){displayStarted=true;beginDisplayListeners();}
});
