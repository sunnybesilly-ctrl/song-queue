<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Album Display</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
padding: 0;
background-color: #0a140c;
background: radial-gradient(circle at top, #1a2e1d 0%, #050a06 100%);
color: white;
font-family: 'Inter', sans-serif;
overflow: hidden;
height: 100vh;
}

/* --- IDLE SCREEN (The "SEND YOUR SHOTS" layout) --- */
#idle-screen {
width: 100vw;
height: 100vh;
display: flex;
flex-direction: column;
justify-content: space-between;
position: absolute;
top: 0;
left: 0;
z-index: 1;
transition: opacity 0.5s ease;
}

.main-content {
display: flex;
flex-direction: row;
align-items: center;
justify-content: space-between;
padding: 0 5vw;
height: 100%;
}

/* Huge Glowing Text */
.title-container {
display: flex;
flex-direction: column;
line-height: 0.85;
}
.title-container span {
font-family: 'Anton', sans-serif;
font-size: 16vw;
color: #e2ff00;
text-shadow: 0 0 40px rgba(226, 255, 0, 0.6);
letter-spacing: -2px;
animation: pulse 2s infinite alternate;
}
@keyframes pulse {
0% { text-shadow: 0 0 20px rgba(226, 255, 0, 0.4); }
100% { text-shadow: 0 0 60px rgba(226, 255, 0, 0.8), 0 0 20px #e2ff00; }
}

/* Right Side Instructions */
.instructions {
max-width: 35vw;
border-left: 8px solid #7dff4a;
padding-left: 20px;
}
.instructions p {
font-size: 1.5vw;
color: #a3bca3;
margin: 10px 0;
line-height: 1.4;
}
.instructions h2 {
font-size: 3.5vw;
color: #e2ff00;
margin: 10px 0;
font-weight: bold;
}
.qr-container {
margin-top: 20px;
background: white;
padding: 15px;
border-radius: 10px;
display: inline-block;
box-shadow: 0 0 30px rgba(226, 255, 0, 0.3);
}
.qr-container img {
width: 15vw;
height: 15vw;
display: block;
}

/* Bottom Marquee */
.marquee {
background-color: #e2ff00;
color: #000;
font-family: 'Anton', sans-serif;
font-size: 3vw;
padding: 10px 0;
white-space: nowrap;
overflow: hidden;
position: absolute;
bottom: 0;
width: 100%;
z-index: 2;
}
.marquee-content {
display: inline-block;
animation: scroll 20s linear infinite;
}
@keyframes scroll {
0% { transform: translateX(0); }
100% { transform: translateX(-50%); }
}

/* --- MEDIA PLAYER OVERLAY --- */
#media-overlay {
position: absolute;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: #000;
display: none; /* Hidden by default */
justify-content: center;
align-items: center;
z-index: 10;
opacity: 0;
transition: opacity 0.5s ease;
}
#media-overlay.active {
display: flex;
opacity: 1;
}
#media-overlay img, #media-overlay video {
width: 100%;
height: 100%;
object-fit: contain;
}
</style>
</head>
<body>

<!-- IDLE SCREEN -->
<div id="idle-screen">
<div class="main-content">
<div class="title-container">
<span>SEND</span>
<span>YOUR</span>
<span>SHOTS</span>
</div>

<div class="instructions">
<p>Scan the QR code with your camera to</p>
<h2>SEND TO THE ALBUM</h2>
<p>Pick a photo or video. It joins the album instantly!</p>
<div class="qr-container">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://sunnybesilly-ctrl.github.io/song-queue/upload.html" alt="Scan to Upload">
</div>
</div>
</div>

<!-- Scrolling Banner -->
<div class="marquee">
<div class="marquee-content">
PHOTO ✦ SEND A VIDEO UP TO 30 SECONDS ✦ PUT YOUR NAME ✦ PHOTO ✦ SEND A VIDEO UP TO 30 SECONDS ✦ PUT YOUR NAME ✦ PHOTO ✦ SEND A VIDEO UP TO 30 SECONDS ✦ PUT YOUR NAME ✦
</div>
</div>
</div>

<!-- MEDIA PLAYER (Hidden until a photo arrives) -->
<div id="media-overlay">
<img id="display-img" src="" style="display:none;" alt="Party Media">
<video id="display-video" style="display:none;" muted playsinline></video>
</div>

<!-- FIREBASE LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ⚠️ REPLACE THIS WITH YOUR REAL FIREBASE CONFIG ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyC8iZiPt_BOZBJ8xiGZLELHRHqv6OSjUXg",
  authDomain: "dj-photo-wall.firebaseapp.com",
  projectId: "dj-photo-wall",
  storageBucket: "dj-photo-wall.firebasestorage.app",
  messagingSenderId: "187308843014",
  appId: "1:187308843014:web:a4dbf9c17011767890a387"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let mediaList = [];
let currentIndex = 0;
let isPlaying = false;
let slideTimer = null;

const idleScreen = document.getElementById('idle-screen');
const mediaOverlay = document.getElementById('media-overlay');
const imgEl = document.getElementById('display-img');
const vidEl = document.getElementById('display-video');

// Listen to Firestore in real-time
const q = query(collection(db, "media_queue"), orderBy("timestamp", "asc"));

onSnapshot(q, (snapshot) => {
mediaList = [];
snapshot.forEach((doc) => {
mediaList.push(doc.data());
});

// If photos exist and we aren't playing, start the show
if (!isPlaying && mediaList.length > 0) {
isPlaying = true;
currentIndex = 0;
showMedia();
}
// If the queue is empty, show the QR code
if (mediaList.length === 0 && isPlaying) {
isPlaying = false;
showIdle();
}
});

function showIdle() {
clearTimeout(slideTimer);
vidEl.pause();
vidEl.src = "";
imgEl.src = "";

mediaOverlay.classList.remove('active');
idleScreen.style.opacity = '1';
}

function showMedia() {
// If we've reached the end of the list, show QR code for 8 seconds, then loop
if (currentIndex >= mediaList.length) {
showIdle();
slideTimer = setTimeout(() => {
currentIndex = 0;
if (mediaList.length > 0) showMedia();
}, 8000); // 8 seconds of QR code
return;
}

const currentMedia = mediaList[currentIndex];

// Show the overlay
idleScreen.style.opacity = '0';
mediaOverlay.classList.add('active');

clearTimeout(slideTimer);
vidEl.pause();

if (currentMedia.type === 'video') {
imgEl.style.display = 'none';
vidEl.style.display = 'block';
vidEl.src = currentMedia.url;

// Play video
vidEl.play().catch(e => {
console.log("Autoplay blocked, skipping video...");
currentIndex++;
showMedia();
});

// When video ends, move to next
vidEl.onended = () => {
currentIndex++;
showMedia();
};

} else {
vidEl.style.display = 'none';
imgEl.style.display = 'block';

// Wait for image to load before starting the 10s timer
imgEl.onload = () => {
clearTimeout(slideTimer);
slideTimer = setTimeout(() => {
currentIndex++;
showMedia();
}, 10000); // 10 seconds
};

// If the image fails to load (broken link), skip it
imgEl.onerror = () => {
console.log("Image failed to load, skipping...");
currentIndex++;
showMedia();
};

imgEl.src = currentMedia.url;
}
}
</script>
</body>
</html>
